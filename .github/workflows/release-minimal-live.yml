name: Minimal Live Release
on:
  push:
    branches: [main]
    paths: ["RELEASE-REQUEST.txt"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: minimal-live-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Збірка компактного live-носія та реліз
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Повний набір перевірок
        run: |
          set -euo pipefail
          python -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml
          make check
      - name: Встановити Guix і QEMU на runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y guix qemu-system-x86 qemu-utils ovmf
          sudo systemctl enable --now guix-daemon.service
          guix --version
          qemu-system-x86_64 --version
          df -h /
      - name: Перевірити запит релізу
        id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Minimal Live releases may only run from refs/heads/main." >&2
            exit 1
          fi
          mapfile -t REQUEST_TAGS < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' RELEASE-REQUEST.txt
          )
          if [ "${#REQUEST_TAGS[@]}" -ne 1 ]; then
            echo "RELEASE-REQUEST.txt must contain exactly one non-comment tag." >&2
            exit 1
          fi
          TAG="$(printf '%s' "${REQUEST_TAGS[0]}" | tr -d '[:space:]')"
          test "$TAG" = "0.1.0-rc3-minimal-live"
          RELEASE_EXISTS=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
            IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_INFO")"
            TARGET_COMMIT="$(jq -r '.targetCommitish' <<< "$RELEASE_INFO")"
            if [ "$IS_DRAFT" != "true" ] || [ "$TARGET_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Existing release is published or targets another commit; refusing to reuse it." >&2
              exit 1
            fi
            RELEASE_EXISTS=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag exists without a matching draft release; refusing to reuse it." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_exists=$RELEASE_EXISTS" >> "$GITHUB_OUTPUT"
      - name: Зібрати мінімальний ISO через locked Guix
        env:
          WSM_ISO_DIR: ${{ runner.temp }}/wsm-live-build
        run: |
          set -euo pipefail
          mkdir -p "$WSM_ISO_DIR"
          # Everything this step prints goes to step.log, not just the build:
          # make returns 2 for any failed recipe, and the checks below refuse
          # with their own messages. Both used to be lost in the job log, which
          # needs authentication to read.
          exec > >(tee -a "$WSM_ISO_DIR/step.log") 2>&1
          WSM_LIVE_PROFILE=systems/live-minimal.scm make image-live-minimal
          ISO_LINK="$WSM_ISO_DIR/wsm-desktop-live.iso"
          test -L "$ISO_LINK"
          ISO_STORE="$(readlink -f "$ISO_LINK")"
          test -s "$ISO_STORE"
          DIST="$RUNNER_TEMP/wsm-live-dist"
          mkdir -p "$DIST"
          ISO_NAME="WSM-Desktop-0.1.0-rc3-Minimal-Live.iso"
          cp -- "$ISO_STORE" "$DIST/$ISO_NAME"
          chmod 0644 "$DIST/$ISO_NAME"
          SIZE="$(stat -c '%s' "$DIST/$ISO_NAME")"
          echo "ISO size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          cp "$WSM_ISO_DIR/manifest.json" "$DIST/build-manifest.json"
          cp docs/RELEASE-MINIMAL-LIVE.md "$DIST/RELEASE-NOTES.md"
          echo "release_dist=$DIST" >> "$GITHUB_ENV"
          echo "release_iso=$ISO_NAME" >> "$GITHUB_ENV"
      - name: BIOS boot acceptance
        run: |
          set -euo pipefail
          python scripts/qemu_boot_smoke.py --iso "$release_dist/$release_iso" \
            --firmware bios --boot-marker WSM_LIVE_READY --timeout-seconds 300 \
            | tee "$release_dist/boot-bios.json"
      - name: UEFI boot acceptance
        run: |
          set -euo pipefail
          OVMF_DIR=/usr/share/OVMF
          if [ -s "$OVMF_DIR/OVMF_CODE_4M.fd" ] && [ -s "$OVMF_DIR/OVMF_VARS_4M.fd" ]; then
            OVMF_CODE="$OVMF_DIR/OVMF_CODE_4M.fd"; OVMF_VARS="$OVMF_DIR/OVMF_VARS_4M.fd"
          elif [ -s "$OVMF_DIR/OVMF_CODE.fd" ] && [ -s "$OVMF_DIR/OVMF_VARS.fd" ]; then
            OVMF_CODE="$OVMF_DIR/OVMF_CODE.fd"; OVMF_VARS="$OVMF_DIR/OVMF_VARS.fd"
          else
            find "$OVMF_DIR" -maxdepth 1 -type f -printf '%f\n' | sort >&2
            exit 1
          fi
          python scripts/qemu_boot_smoke.py --iso "$release_dist/$release_iso" \
            --firmware uefi --ovmf-code "$OVMF_CODE" --ovmf-vars "$OVMF_VARS" \
            --boot-marker WSM_LIVE_READY --timeout-seconds 300 \
            | tee "$release_dist/boot-uefi.json"
      - name: Зберегти діагностику boot smoke
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wsm-live-boot-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wsm-live-dist/boot-bios.json
            ${{ runner.temp }}/wsm-live-dist/boot-uefi.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Маніфест і контрольні суми
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python - "$release_dist" "$release_iso" "$GITHUB_SHA" "$RELEASE_TAG" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1]); iso_name,commit,tag=sys.argv[2:]; iso=root/iso_name
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          bp=root/"build-manifest.json"; build=json.loads(bp.read_text(encoding="utf-8"))
          artifact=build.get("artifact")
          if not isinstance(artifact,dict): raise SystemExit("missing artifact in builder manifest")
          artifact.update({"filename":iso_name,"regular_file":True,"size_bytes":iso.stat().st_size,"sha256":sha(iso)})
          bp.write_text(json.dumps(build,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          bios=json.loads((root/"boot-bios.json").read_text(encoding="utf-8"))
          uefi=json.loads((root/"boot-uefi.json").read_text(encoding="utf-8"))
          if bios.get("boot_confirmed") is not True or uefi.get("boot_confirmed") is not True:
              raise SystemExit("BIOS and UEFI marker checks must both pass")
          source=build.get("source",{})
          manifest={"schema":"wsm-live-release/1",
            "release":{"tag":tag,"source_commit":commit,"profile":"systems/live-minimal.scm",
              "locked_guix_channel_commit":source.get("locked_guix_channel_commit"),
              "guix_version":build.get("guix",{}).get("locked_version")},
            "artifact":{"filename":iso_name,"bytes":iso.stat().st_size,"sha256":sha(iso),"maximum_bytes":2147483647},
            "acceptance":{"bios":"pass","uefi":"pass","marker":"WSM_LIVE_READY"},
            "installer":{"entrypoint":"wsm-install-live","mode":"read-only TUI preview","apply_enabled":False},
            "build_manifest_sha256":sha(bp),
            "boot_evidence":{"bios_sha256":sha(root/"boot-bios.json"),"uefi_sha256":sha(root/"boot-uefi.json")}}
          (root/"release-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          files=[iso,bp,root/"release-manifest.json",root/"boot-bios.json",root/"boot-uefi.json"]
          (root/"SHA256SUMS").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files),encoding="utf-8")
          PY
          (cd "$release_dist" && sha256sum -c SHA256SUMS)
      - name: Поділити образ на частини, якщо він більший за один asset
        run: |
          set -euo pipefail
          SIZE="$(stat -c '%s' "$release_dist/$release_iso")"
          # GitHub caps one release asset at 2 GiB. A Guix system closure does
          # not fit, and refusing outright would mean never shipping: the
          # previous release shipped as parts with a checksum file.
          # This runs after acceptance and the manifest, which need the whole
          # file - so the image is split only on its way out.
          if [ "$SIZE" -gt 2147483647 ]; then
            echo "ISO is $SIZE bytes; publishing as parts"
            split -b 1900M -d -a 3 "$release_dist/$release_iso" \
              "$release_dist/$release_iso.part"
            rm -f "$release_dist/$release_iso"
            echo "release_parts=1" >> "$GITHUB_ENV"
          else
            echo "ISO is $SIZE bytes; publishing whole"
            echo "release_parts=0" >> "$GITHUB_ENV"
          fi
          # The checksum manifest and the release manifest were written while
          # the whole image still existed. Once it is split, both must describe
          # what is actually published, or the read-back check rejects the
          # upload for a file that is no longer supposed to be there.
          python - "$release_dist" "$release_iso" "$release_parts" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1]); iso_name = sys.argv[2]; split = sys.argv[3] == "1"

          def sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest_path = root / "release-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          artifact = manifest["artifact"]
          parts = sorted(p.name for p in root.glob(iso_name + ".part*"))
          if split:
              artifact["published_as"] = "parts"
              artifact["parts"] = parts
              artifact["parts_count"] = len(parts)
              artifact["note"] = (
                  "The image exceeds one GitHub asset; concatenate the parts in "
                  "lexical order to obtain the file whose sha256 is recorded here."
              )
          else:
              artifact["published_as"] = "whole"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          covered = [root / name for name in parts]
          if not split:
              covered.append(root / iso_name)
          covered += [root / "build-manifest.json", manifest_path,
                      root / "boot-bios.json", root / "boot-uefi.json"]
          if split:
              sidecar = root / "ISO-CHECKSUMS.sha256"
              sidecar.write_text(
                  "".join(f"{sha(root / name)}  {name}\n" for name in parts),
                  encoding="utf-8",
              )
              # The read-back verifier compares the remote asset set with
              # every entry in SHA256SUMS. The parts sidecar is itself a
              # published asset, so the top-level manifest must cover it too.
              covered.append(sidecar)
          (root / "SHA256SUMS").write_text(
              "".join(f"{sha(path)}  {path.name}\n" for path in covered),
              encoding="utf-8",
          )
          print("checksums rewritten for", artifact["published_as"])
          PY
          ls -la "$release_dist"

      - name: Створити чернетку релізу та завантажити assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.release_exists }}
        run: |
          set -euo pipefail
          ASSETS=()
          # Either the whole image, or its parts when it exceeds one asset.
          for candidate in "$release_dist/$release_iso" "$release_dist/$release_iso".part* \
                           "$release_dist/ISO-CHECKSUMS.sha256"; do
            [ -f "$candidate" ] && ASSETS+=("$candidate")
          done
          ASSETS+=(
            "$release_dist/SHA256SUMS"
            "$release_dist/build-manifest.json"
            "$release_dist/release-manifest.json"
            "$release_dist/boot-bios.json"
            "$release_dist/boot-uefi.json"
          )
          if [ "$RELEASE_EXISTS" = "true" ]; then
            # Resume only a draft tied to this exact source commit. Remove every
            # old upload so an interrupted/previous attempt cannot leave extras.
            while IFS= read -r ASSET_NAME; do
              [ -n "$ASSET_NAME" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$ASSET_NAME" \
                --repo "$GITHUB_REPOSITORY" --yes
            done < <(
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name'
            )
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --draft --prerelease \
              --title "WSM Desktop 0.1.0-rc3 — Minimal Live Installer Preview" \
              --notes-file "$release_dist/RELEASE-NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}"
      - name: Перевірити завантажені assets до публікації
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          REMOTE_DIR="$RUNNER_TEMP/wsm-live-remote-assets"
          rm -rf -- "$REMOTE_DIR"
          install -d -m 0700 "$REMOTE_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$REMOTE_DIR"
          python scripts/verify_release_assets.py \
            --expected-dir "$release_dist" --downloaded-dir "$REMOTE_DIR"
          RELEASE_INFO="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          test "$(jq -r '.isDraft' <<< "$RELEASE_INFO")" = "true"
          test "$(jq -r '.targetCommitish' <<< "$RELEASE_INFO")" = "$GITHUB_SHA"
          {
            echo "### Перевірка release assets"
            echo ""
            echo "Чернетку завантажено назад із GitHub; точний набір файлів і SHA-256 збігаються."
            echo "Tag: `$RELEASE_TAG`"
            echo "Source: `$GITHUB_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Підписати provenance релізних артефактів
        id: attest-release-artifacts
        uses: actions/attest@v4
        with:
          # The image may be split into parts by now, so attest both forms:
          # a glob would satisfy the split case but silently attest nothing if
          # the name ever changed.
          subject-path: |
            ${{ runner.temp }}/wsm-live-dist/WSM-Desktop-0.1.0-rc3-Minimal-Live.iso
            ${{ runner.temp }}/wsm-live-dist/WSM-Desktop-0.1.0-rc3-Minimal-Live.iso.part*
            ${{ runner.temp }}/wsm-live-dist/SHA256SUMS
            ${{ runner.temp }}/wsm-live-dist/build-manifest.json
            ${{ runner.temp }}/wsm-live-dist/release-manifest.json
            ${{ runner.temp }}/wsm-live-dist/boot-bios.json
            ${{ runner.temp }}/wsm-live-dist/boot-uefi.json
          create-storage-record: false
      - name: Перевірити версію GitHub CLI для перевірки provenance
        run: |
          set -euo pipefail
          GH_VERSION="$(gh version | awk 'NR == 1 { print $3 }')"
          MINIMUM_VERSION="2.102.0"
          if [ "$(printf '%s\n' "$MINIMUM_VERSION" "$GH_VERSION" | sort -V | head -n 1)" != "$MINIMUM_VERSION" ]; then
            echo "gh >= ${MINIMUM_VERSION} is required for exact signer-workflow verification; found ${GH_VERSION:-unknown}." >&2
            exit 1
          fi
          {
            echo "### Версія верифікатора provenance"
            echo ""
            echo "GitHub CLI: $GH_VERSION"
            echo "Required minimum: $MINIMUM_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Перевірити provenance артефактів перед публікацією
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.attest-release-artifacts.outputs.bundle-path }}"
          test -s "$BUNDLE"
          for ASSET in \
            "WSM-Desktop-0.1.0-rc3-Minimal-Live.iso" \
            "SHA256SUMS" \
            "build-manifest.json" \
            "release-manifest.json" \
            "boot-bios.json" \
            "boot-uefi.json"
          do
            gh attestation verify "$release_dist/$ASSET" \
              --bundle "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-minimal-live.yml" \
              --source-ref refs/heads/main \
              --predicate-type "https://slsa.dev/provenance/v1"
          done
          {
            echo "### Криптографічна перевірка походження"
            echo ""
            echo "SLSA provenance і точний signer/source ref перевірено для кожного release asset."
            echo "Signer workflow: $GITHUB_REPOSITORY/.github/workflows/release-minimal-live.yml"
            echo "Source ref: refs/heads/main"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Опублікувати перевірений GitHub pre-release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          RELEASE_INFO="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
          test "$(jq -r '.isDraft' <<< "$RELEASE_INFO")" = "false"
          test "$(jq -r '.targetCommitish' <<< "$RELEASE_INFO")" = "$GITHUB_SHA"
      - name: Повідомити причину збою
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### Minimal Live Release: збірка не завершилась"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            # Not just the three files we expected: any step may fail, and a
            # step that failed is the one whose output matters. Dump whatever
            # the build directory actually holds, newest last.
            for log in "$RUNNER_TEMP"/wsm-live-build/*.log \
                       "$RUNNER_TEMP"/wsm-live-build/*.json \
                       "$RUNNER_TEMP"/wsm-live-dist/*.json; do
              [ -f "$log" ] || continue
              echo "#### $(basename "$log")"
              echo '```'
              tail -60 "$log"
              echo '```'
            done
            echo "#### образи в каталозі збірки"
            echo '```'
            ls -la "$RUNNER_TEMP/wsm-live-build" "$RUNNER_TEMP/wsm-live-dist" 2>&1 || true
            echo '```'
            df -h / || true
          } > "$BODY"
          # Логи задачі потребують авторизації; коментар до коміту читається
          # інструментами, тому причина збою лишається тут.
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null && echo "причину записано коментарем"
