name: Minimal Live Release
on:
  push:
    branches: [main]
    paths: ["RELEASE-REQUEST.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minimal-live-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Збірка компактного live-носія та реліз
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Повний набір перевірок
        run: |
          set -euo pipefail
          python -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml
          make check
      - name: Встановити Guix і QEMU на runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y guix qemu-system-x86 qemu-utils ovmf
          sudo systemctl enable --now guix-daemon.service
          guix --version
          qemu-system-x86_64 --version
          df -h /
      - name: Перевірити запит релізу
        id: release
        run: |
          set -euo pipefail
          mapfile -t REQUEST_TAGS < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' RELEASE-REQUEST.txt
          )
          if [ "${#REQUEST_TAGS[@]}" -ne 1 ]; then
            echo "RELEASE-REQUEST.txt must contain exactly one non-comment tag." >&2
            exit 1
          fi
          TAG="$(printf '%s' "${REQUEST_TAGS[0]}" | tr -d '[:space:]')"
          test "$TAG" = "0.1.0-rc3-minimal-live"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to reuse it." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Зібрати мінімальний ISO через locked Guix
        env:
          WSM_ISO_DIR: ${{ runner.temp }}/wsm-live-build
        run: |
          set -euo pipefail
          WSM_LIVE_PROFILE=systems/live-minimal.scm make image-live-minimal
          ISO_LINK="$WSM_ISO_DIR/wsm-desktop-live.iso"
          test -L "$ISO_LINK"
          ISO_STORE="$(readlink -f "$ISO_LINK")"
          test -s "$ISO_STORE"
          DIST="$RUNNER_TEMP/wsm-live-dist"
          mkdir -p "$DIST"
          ISO_NAME="WSM-Desktop-0.1.0-rc3-Minimal-Live.iso"
          cp -- "$ISO_STORE" "$DIST/$ISO_NAME"
          chmod 0644 "$DIST/$ISO_NAME"
          SIZE="$(stat -c '%s' "$DIST/$ISO_NAME")"
          test "$SIZE" -le 2147483647 || { echo "ISO >= 2 GiB; refusing release" >&2; exit 1; }
          cp "$WSM_ISO_DIR/manifest.json" "$DIST/build-manifest.json"
          cp docs/RELEASE-MINIMAL-LIVE.md "$DIST/RELEASE-NOTES.md"
          echo "release_dist=$DIST" >> "$GITHUB_ENV"
          echo "release_iso=$ISO_NAME" >> "$GITHUB_ENV"
      - name: BIOS boot acceptance
        run: |
          set -euo pipefail
          python scripts/qemu_boot_smoke.py --iso "$release_dist/$release_iso" \
            --firmware bios --boot-marker WSM_LIVE_READY --timeout-seconds 300 \
            > "$release_dist/boot-bios.json"
      - name: UEFI boot acceptance
        run: |
          set -euo pipefail
          OVMF_DIR=/usr/share/OVMF
          if [ -s "$OVMF_DIR/OVMF_CODE_4M.fd" ] && [ -s "$OVMF_DIR/OVMF_VARS_4M.fd" ]; then
            OVMF_CODE="$OVMF_DIR/OVMF_CODE_4M.fd"; OVMF_VARS="$OVMF_DIR/OVMF_VARS_4M.fd"
          elif [ -s "$OVMF_DIR/OVMF_CODE.fd" ] && [ -s "$OVMF_DIR/OVMF_VARS.fd" ]; then
            OVMF_CODE="$OVMF_DIR/OVMF_CODE.fd"; OVMF_VARS="$OVMF_DIR/OVMF_VARS.fd"
          else
            find "$OVMF_DIR" -maxdepth 1 -type f -printf '%f\n' | sort >&2
            exit 1
          fi
          python scripts/qemu_boot_smoke.py --iso "$release_dist/$release_iso" \
            --firmware uefi --ovmf-code "$OVMF_CODE" --ovmf-vars "$OVMF_VARS" \
            --boot-marker WSM_LIVE_READY --timeout-seconds 300 \
            > "$release_dist/boot-uefi.json"
      - name: Маніфест і контрольні суми
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python - "$release_dist" "$release_iso" "$GITHUB_SHA" "$RELEASE_TAG" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root=Path(sys.argv[1]); iso_name,commit,tag=sys.argv[2:]; iso=root/iso_name
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          bp=root/"build-manifest.json"; build=json.loads(bp.read_text(encoding="utf-8"))
          artifact=build.get("artifact")
          if not isinstance(artifact,dict): raise SystemExit("missing artifact in builder manifest")
          artifact.update({"filename":iso_name,"regular_file":True,"size_bytes":iso.stat().st_size,"sha256":sha(iso)})
          bp.write_text(json.dumps(build,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          bios=json.loads((root/"boot-bios.json").read_text(encoding="utf-8"))
          uefi=json.loads((root/"boot-uefi.json").read_text(encoding="utf-8"))
          if bios.get("boot_confirmed") is not True or uefi.get("boot_confirmed") is not True:
              raise SystemExit("BIOS and UEFI marker checks must both pass")
          source=build.get("source",{})
          manifest={"schema":"wsm-live-release/1",
            "release":{"tag":tag,"source_commit":commit,"profile":"systems/live-minimal.scm",
              "locked_guix_channel_commit":source.get("locked_guix_channel_commit"),
              "guix_version":build.get("guix",{}).get("locked_version")},
            "artifact":{"filename":iso_name,"bytes":iso.stat().st_size,"sha256":sha(iso),"maximum_bytes":2147483647},
            "acceptance":{"bios":"pass","uefi":"pass","marker":"WSM_LIVE_READY"},
            "installer":{"entrypoint":"wsm-install-live","mode":"read-only TUI preview","apply_enabled":False},
            "build_manifest_sha256":sha(bp),
            "boot_evidence":{"bios_sha256":sha(root/"boot-bios.json"),"uefi_sha256":sha(root/"boot-uefi.json")}}
          (root/"release-manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          files=[iso,bp,root/"release-manifest.json",root/"boot-bios.json",root/"boot-uefi.json"]
          (root/"SHA256SUMS").write_text("".join(f"{sha(p)}  {p.name}\n" for p in files),encoding="utf-8")
          PY
          (cd "$release_dist" && sha256sum -c SHA256SUMS)
      - name: Опублікувати GitHub pre-release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "WSM Desktop 0.1.0-rc3 — Minimal Live Installer Preview" \
            --notes-file "$release_dist/RELEASE-NOTES.md" \
            "$release_dist/$release_iso" "$release_dist/SHA256SUMS" \
            "$release_dist/build-manifest.json" "$release_dist/release-manifest.json" \
            "$release_dist/boot-bios.json" "$release_dist/boot-uefi.json"

      - name: Повідомити причину збою
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### Minimal Live Release: збірка не завершилась"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            for log in "$RUNNER_TEMP/wsm-live-build/build.log" \
                       "$RUNNER_TEMP/wsm-live-build/channel-resolution.log"; do
              if [ -f "$log" ]; then
                echo "#### $(basename "$log")"
                echo '```'
                tail -60 "$log"
                echo '```'
              fi
            done
            df -h / || true
          } > "$BODY"
          # Логи задачі потребують авторизації; коментар до коміту читається
          # інструментами, тому причина збою лишається тут.
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null && echo "причину записано коментарем"
