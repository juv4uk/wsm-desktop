name: QEMU harness ISO integration

on:
  push:
    branches:
      - work/qemu-harness-iso-integration
  pull_request:
    paths:
      - "scripts/qemu_boot_smoke.py"
      - "tests/test_qemu_boot_smoke.py"
      - "docs/testing/QEMU-HARNESS-INTEGRATION.md"
      - ".github/workflows/qemu-harness-iso-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-through-project-harness:
    name: Boot synthetic ISO through wsm QEMU harness
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install isolated integration-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils \
            grub-common grub-pc-bin xorriso mtools \
            busybox-static cpio gzip

      - name: Build a minimal serial-console ISO
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly MARKER="WSM_QEMU_HARNESS_ISO_BOOT_OK"
          readonly WORK_DIR="$RUNNER_TEMP/wsm-qemu-harness-iso"
          readonly ISO_ROOT="$WORK_DIR/iso-root"
          readonly ROOTFS="$WORK_DIR/rootfs"
          readonly ISO_PATH="$WORK_DIR/wsm-qemu-harness.iso"

          rm -rf "$WORK_DIR"
          mkdir -p "$ISO_ROOT/boot/grub" "$ROOTFS/bin" "$ROOTFS/dev"

          KERNEL_IMAGE="/boot/vmlinuz-$(uname -r)"
          if [[ ! -f "$KERNEL_IMAGE" ]]; then
            echo "Runner kernel image is unavailable: $KERNEL_IMAGE" >&2
            ls -la /boot
            exit 1
          fi
          # The runner kernel is root-readable; copy only this input into the
          # temporary ISO tree. The QEMU guest never receives a host device.
          sudo cat "$KERNEL_IMAGE" > "$ISO_ROOT/boot/vmlinuz"
          chmod 0644 "$ISO_ROOT/boot/vmlinuz"

          cp "$(command -v busybox)" "$ROOTFS/bin/busybox"
          ln -s busybox "$ROOTFS/bin/sh"
          sudo mknod -m 600 "$ROOTFS/dev/console" c 5 1

          cat > "$ROOTFS/init" <<'INIT'
          #!/bin/sh
          echo WSM_QEMU_HARNESS_ISO_BOOT_OK > /dev/console
          /bin/busybox poweroff -f
          INIT
          chmod 0755 "$ROOTFS/init"

          (
            cd "$ROOTFS"
            find . -print0 | sort -z | cpio --null --create --format=newc
          ) | gzip -9 > "$ISO_ROOT/boot/initramfs.cpio.gz"

          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
          terminal_input serial
          terminal_output serial

          menuentry "WSM QEMU harness integration guest" {
              linux /boot/vmlinuz console=ttyS0,115200 rdinit=/init panic=-1 loglevel=3
              initrd /boot/initramfs.cpio.gz
          }
          GRUB

          grub-mkrescue --output="$ISO_PATH" "$ISO_ROOT"
          test -s "$ISO_PATH"
          echo "Synthetic bootable ISO created: $ISO_PATH"
          echo "Expected guest-only serial marker: $MARKER"
          echo "ISO_PATH=$ISO_PATH" >> "$GITHUB_ENV"

      - name: Run the actual WSM QEMU harness
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly MARKER="WSM_QEMU_HARNESS_ISO_BOOT_OK"
          readonly RESULT="$RUNNER_TEMP/wsm-qemu-harness-result.json"

          set +e
          python scripts/qemu_boot_smoke.py \
            --iso "$ISO_PATH" \
            --timeout-seconds 45 \
            --memory-mib 512 \
            --cpus 1 \
            --disk-size 256M \
            --boot-marker "$MARKER" \
            > "$RESULT"
          HARNESS_STATUS=$?
          set -e

          # Print the bounded serial tail even when the harness rejects the boot.
          cat "$RESULT"
          if [[ "$HARNESS_STATUS" -ne 0 ]]; then
            echo "WSM QEMU harness exited with status $HARNESS_STATUS" >&2
            exit "$HARNESS_STATUS"
          fi

          python - "$RESULT" "$MARKER" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          marker = sys.argv[2]
          assert payload["mode"] == "qemu-boot-smoke", payload
          assert payload["boot_confirmed"] is True, payload
          assert payload["boot_marker_configured"] is True, payload
          assert marker in payload["serial_output_tail"], payload
          assert payload["host_device_passthrough"] is False, payload
          assert payload["network_enabled"] is False, payload
          assert payload["efi_variable_store"] is False, payload
          assert payload["guest_installer_execution"] is False, payload
          print("PASS: the project harness booted the synthetic ISO and observed the guest marker.")
          print("Scope: generic QEMU harness integration only; not a WSM installer or hardware test.")
          PY
