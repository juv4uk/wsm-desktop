name: Субститути каналу — тимчасовий fail-closed gate

# SPDX-License-Identifier: LicenseRef-Volnist
#
# Цей ручний workflow лише пояснює, чому публікацію зупинено.
# Жодних checkout, build, signing, NAR export, Release чи Pages операцій.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Публікація призупинена до проходження trust та licensing gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Повідомити про стан публікації
        if: always()
        run: |
          {
            echo "# PUBLICATION_PAUSED — substitute cache не публікувався"
            echo
            echo "Цей workflow навмисно не збирає пакети, не читає signing secrets і не змінює GitHub Releases або Pages."
            echo
            echo "Перед окремим publication PR мають бути закриті всі умови:"
            echo "- #367: owner-ratified package license та redistribution decision; WSM-owned packages виключені до цього рішення."
            echo "- #534 / Phase B: owner-signed WSM introduction/history, .guix-authorizations, public keyring та успішний звичайний guix git authenticate consumer."
            echo "- ADR: письмово визначені signing-key custody, ротація/відкликання, endpoint, retention та відповідальний оператор."
            echo "- Exact package allowlist, channel commits і provenance для кожного root; жодних довільних package inputs."
            echo
            echo "Перший upstream-only build evidence lane: PR #773 (linux-libre + mesa); це не дозвіл на публікацію."
            echo
            echo "Жоден NAR, Release asset, Pages metadata або substitute endpoint цим workflow не створено."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::PUBLICATION_PAUSED: #367, #534/Phase B and signing-key custody gates are not complete."
          exit 1
