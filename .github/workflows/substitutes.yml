# SPDX-License-Identifier: LicenseRef-Volnist
name: H170 Free Guix substitute cache

# Publish only the fixed, upstream-only H170 Free manifest.
# No WSM-owned packages, Nonguix, proprietary drivers or firmware are included.
# Binary outputs go to immutable GitHub Release assets; narinfo metadata goes to Pages.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/substitutes.yml"
      - "channels.lock.scm"
      - "drivers/profiles/h170-free-packages.scm"
      - "scripts/narinfo_to_release_urls.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: h170-free-substitutes
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build, sign and publish H170 Free substitutes
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout pinned source inputs
        uses: actions/checkout@v7

      - name: Install GNU Guix 1.5.0
        env:
          GUIX_VERSION: "1.5.0"
          GUIX_SHA256: "aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817"
        run: |
          set -euo pipefail
          TARBALL="guix-binary-${GUIX_VERSION}.x86_64-linux.tar.xz"
          DEST="${RUNNER_TEMP}/${TARBALL}"
          PROFILE="/var/guix/profiles/per-user/root/current-guix"
          curl -fsSL --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 20 --max-time 900 \
            -o "$DEST" "https://ftp.gnu.org/gnu/guix/${TARBALL}"
          echo "${GUIX_SHA256}  ${DEST}" | sha256sum -c -
          sudo tar --extract --strip-components=1 --file "$DEST" -C /
          sudo mkdir -p /root/.config/guix
          sudo ln -sfn "$PROFILE" /root/.config/guix/current
          sudo ln -sfn "$PROFILE/bin/guix" /usr/local/bin/guix

          getent group guixbuild >/dev/null || sudo groupadd --system guixbuild
          for i in $(seq -w 1 10); do
            id "guixbuilder$i" >/dev/null 2>&1 || \
              sudo useradd -g guixbuild -G guixbuild -d /var/empty \
                -s /usr/sbin/nologin -c "Guix build user $i" --system "guixbuilder$i"
          done
          sudo mkdir -p /var/log/guix
          sudo bash -c "nohup $PROFILE/bin/guix-daemon --build-users-group=guixbuild \
            >/var/log/guix/daemon.log 2>&1 &"
          for _ in $(seq 1 60); do
            [ -S /var/guix/daemon-socket/socket ] && break
            sleep 1
          done
          [ -S /var/guix/daemon-socket/socket ] || {
            sudo tail -n 80 /var/log/guix/daemon.log || true
            echo "::error::guix-daemon did not create its socket"
            exit 1
          }
          sudo chmod 0666 /var/guix/daemon-socket/socket
          echo "$PROFILE/bin" >> "$GITHUB_PATH"
          guix --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create an ephemeral Guix signing key for this cache run
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0700 /etc/guix
          sudo guix archive --generate-key
          sudo test -s /etc/guix/signing-key.sec
          sudo test -s /etc/guix/signing-key.pub
          sudo chmod 0600 /etc/guix/signing-key.sec
          sudo chmod 0644 /etc/guix/signing-key.pub
          echo "A per-run signing key was generated on the ephemeral runner." >> "$GITHUB_STEP_SUMMARY"
          echo "Only signing-key.pub may leave this runner; signing-key.sec is never copied, uploaded, or logged." >> "$GITHUB_STEP_SUMMARY"

      - name: Record pinned Guix channel revision
        run: |
          set -euo pipefail
          guix time-machine -C channels.lock.scm -- describe -f channels \
            | tee "$RUNNER_TEMP/guix-channels.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Evaluate and build the fixed H170 Free manifest
        run: |
          set -euo pipefail
          PATHS_FILE="$RUNNER_TEMP/h170-free-store-paths.txt"
          LOG_FILE="$RUNNER_TEMP/h170-free-build.log"
          python3 tests/test_h170_free_package_manifest.py
          guix time-machine -C channels.lock.scm -- \
            build --dry-run --no-grafts \
            --manifest=drivers/profiles/h170-free-packages.scm
          if ! guix time-machine -C channels.lock.scm -- \
              build --no-grafts --keep-going \
              --manifest=drivers/profiles/h170-free-packages.scm \
              >"$PATHS_FILE" 2>"$LOG_FILE"; then
            tail -n 160 "$LOG_FILE" >&2 || true
            echo "::error::H170 Free package build failed; no release or Pages deployment was made."
            exit 1
          fi
          mapfile -t STORE_PATHS < <(grep -E '^/gnu/store/[a-z0-9]{32}-' "$PATHS_FILE")
          if [ "${#STORE_PATHS[@]}" -ne 11 ]; then
            echo "::error::Expected 11 package outputs, got ${#STORE_PATHS[@]}"
            cat "$PATHS_FILE" >&2
            exit 1
          fi
          {
            echo "## H170 Free package outputs"
            echo ""
            echo "| Store output |"
            echo "| --- |"
            for store_path in "${STORE_PATHS[@]}"; do
              echo "| `$(basename "$store_path")` |"
            done
            echo ""
            echo "Input: official Guix only, pinned by channels.lock.scm."
            echo "Manifest: drivers/profiles/h170-free-packages.scm."
            echo "No WSM-owned package, Nonguix package, proprietary driver or firmware is in this set."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bake signed NARs into the local substitute cache
        run: |
          set -euo pipefail
          CACHE_DIR="/var/cache/guix/h170-free"
          PATHS_FILE="$RUNNER_TEMP/h170-free-store-paths.txt"
          sudo install -d -m 0755 "$CACHE_DIR"
          sudo nohup guix publish \
            --listen=127.0.0.1 \
            --port=3000 \
            --compression=zstd:9 \
            --cache="$CACHE_DIR" \
            --workers=4 \
            --ttl=90d \
            --public-key=/etc/guix/signing-key.pub \
            --private-key=/etc/guix/signing-key.sec \
            >"$RUNNER_TEMP/guix-publish.log" 2>&1 &
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/nix-cache-info >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/guix-publish.log" >&2 || true
            echo "::error::guix publish did not start"
            exit 1
          fi

          while IFS= read -r store_path; do
            [ -n "$store_path" ] || continue
            hash="${store_path##*/}"
            hash="${hash%%-*}"
            narinfo_url="http://127.0.0.1:3000/${hash}.narinfo"
            baked=0
            for _ in $(seq 1 180); do
              if curl -fsS "$narinfo_url" -o /dev/null; then
                baked=1
                break
              fi
              sleep 5
            done
            if [ "$baked" -ne 1 ]; then
              echo "::error::NAR cache baking timed out for $store_path"
              tail -n 100 "$RUNNER_TEMP/guix-publish.log" >&2 || true
              exit 1
            fi
          done < "$PATHS_FILE"

          NAR_COUNT="$(sudo find "$CACHE_DIR/nar" -type f -name '*.nar.zst' | wc -l)"
          INFO_COUNT="$(sudo find "$CACHE_DIR" -maxdepth 1 -type f -name '*.narinfo' | wc -l)"
          [ "$NAR_COUNT" -eq 11 ] || { echo "Expected 11 NAR archives, got $NAR_COUNT"; exit 1; }
          [ "$INFO_COUNT" -eq 11 ] || { echo "Expected 11 narinfo files, got $INFO_COUNT"; exit 1; }
          echo "Baked $NAR_COUNT signed NAR archives and $INFO_COUNT narinfo records." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare immutable Release assets and Pages metadata
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CACHE_TAG="h170-free-cache-${GITHUB_RUN_NUMBER}"
          echo "cache_tag=$CACHE_TAG" >> "$GITHUB_OUTPUT"
          mkdir -p site
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CACHE_TAG}"
          python3 scripts/narinfo_to_release_urls.py \
            --source /var/cache/guix/h170-free \
            --destination ./site \
            --base-url "$BASE_URL"
          curl -fsS http://127.0.0.1:3000/nix-cache-info -o ./site/nix-cache-info
          curl -fsS http://127.0.0.1:3000/signing-key.pub -o ./site/signing-key.pub
          touch ./site/.nojekyll

          mapfile -t NARS < <(find /var/cache/guix/h170-free/nar -type f -name '*.nar.zst' | sort)
          [ "${#NARS[@]}" -eq 11 ] || { echo "Expected 11 NAR assets, got ${#NARS[@]}"; exit 1; }
          for nar in "${NARS[@]}"; do
            size="$(stat -c '%s' "$nar")"
            [ "$size" -lt 2000000000 ] || {
              echo "::error::NAR asset exceeds the 2 GB Release limit: $nar"
              exit 1
            }
          done

          (
            cd "$RUNNER_TEMP"
            sha256sum "${NARS[@]}" > ./site/SHA256SUMS
          )
          export NAR_ASSETS="$(printf '%s\n' "${NARS[@]}")"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".")
          public_key = root / "site/signing-key.pub"
          manifest = root / "drivers/profiles/h170-free-packages.scm"
          payload = {
              "schema": "wsm-h170-free-cache/1",
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_url": (
                  os.environ["GITHUB_SERVER_URL"] + "/" +
                  os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" +
                  os.environ["GITHUB_RUN_ID"]
              ),
              "guix_lock_file": "channels.lock.scm",
              "manifest_file": "drivers/profiles/h170-free-packages.scm",
              "manifest_sha256": hashlib.sha256(manifest.read_bytes()).hexdigest(),
              "signing_key_mode": "ephemeral-per-run",
              "signing_public_key_sha256": hashlib.sha256(public_key.read_bytes()).hexdigest(),
              "private_key_published": False,
              "nar_assets": [Path(item).name for item in os.environ["NAR_ASSETS"].splitlines() if item],
              "packages": 11,
              "scope": "official upstream H170 Free package manifest only",
          }
          (root / "site/provenance.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          cp ./site/SHA256SUMS ./site/provenance.SHA256SUMS
          (
            cd ./site
            sha256sum signing-key.pub provenance.json > metadata.SHA256SUMS
          )

          gh release create "$CACHE_TAG" \
            --title "WSM H170 Free substitute cache ${GITHUB_RUN_NUMBER}" \
            --notes "Pinned H170 Free upstream-only package cache. Source commit: ${GITHUB_SHA}. Signing key is ephemeral to this run; private key is not published. NAR assets are immutable; metadata is deployed separately to Pages."
          gh release upload "$CACHE_TAG" "${NARS[@]}" ./site/signing-key.pub ./site/SHA256SUMS ./site/provenance.json ./site/metadata.SHA256SUMS

      - name: Attest the exact NAR and cache metadata
        uses: actions/attest@v4
        with:
          subject-path: |
            /var/cache/guix/h170-free/nar/*.nar.zst
            ./site/signing-key.pub
            ./site/SHA256SUMS
            ./site/provenance.json
            ./site/metadata.SHA256SUMS

      - name: Upload Pages metadata
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy Pages metadata
        id: pages
        uses: actions/deploy-pages@v4

      - name: Publish summary
        if: success()
        run: |
          {
            echo "## H170 Free substitute cache published"
            echo ""
            echo "Release tag: `${{ steps.prepare.outputs.cache_tag }}`"
            echo "Pages URL: ${{ steps.pages.outputs.page_url }}"
            echo "Source commit: ${GITHUB_SHA}"
            echo ""
            echo "Only the fixed upstream-only H170 Free manifest was published."
            echo "No WSM-owned binaries, Nonguix payload or proprietary firmware was included."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure
        if: failure()
        run: |
          {
            echo "## H170 Free substitute publication failed"
            echo ""
            echo "Check the first failing step above. No success is claimed."
            echo "If a Release was created before a later Pages failure, its tag is in the workflow logs."
            echo "A missing or mismatched signing key, pinned Guix evaluation/build failure, NAR bake failure or Pages configuration can cause this run to fail."
          } >> "$GITHUB_STEP_SUMMARY"
