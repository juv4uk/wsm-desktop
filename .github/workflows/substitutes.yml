# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM Guix substitutes

# Fail-closed stub. Do not dispatch a substitute publisher until the owner has
# explicitly approved signing-key custody, the exact H170 package allowlist,
# authenticated source provenance, endpoint, rotation and revocation policy.
# Upstream-only H170 package build evidence is handled separately by
# hw-build-evidence.yml; it does not export NARs or publish substitutes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsm-substitute-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ false }}
    name: Disabled pending owner-controlled signer and trust decision
    runs-on: ubuntu-24.04
    steps:
      - name: Publication is not authorized
        run: |
          echo "NOT_AUTHORIZED: no owner-controlled signing-key custody or endpoint ADR"
          exit 1
