name: Субститути каналу

# Публікує зібрані пакети каналу `wsm` як статичний кеш субститутів:
# архіви — release assets, метадані — gh-pages.
#
# Чому саме так, а не «все в gh-pages»: сайт Pages обмежений 1 ГБ, а один
# closure з Qt/Plasma його перевищує. Архіви живуть у релізі (до 2 ГБ на файл),
# метадані — кілька кілобайт — на Pages. Деталі: docs/SUBSTITUTES.md.
#
# Ключ підпису приходить із секрету GUIIX_SIGNING_KEY і НІКОЛИ не з репозиторію.
# Без нього workflow падає з поясненням, а не публікує непідписаний кеш:
# непідписаний кеш користувач не зможе авторизувати, тобто він марний.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Пакети каналу через пробіл"
        required: false
        default: "wsm-tools"
  push:
    branches: [main]
    paths:
      - "wsm/packages/**"
      - "scripts/narinfo_to_release_urls.py"
      - ".github/workflows/substitutes.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: substitutes
  cancel-in-progress: false

jobs:
  publish:
    name: Зібрати, підписати, опублікувати
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Встановити Guix
        run: |
          set -euo pipefail
          wget -q https://git.savannah.gnu.org/cgit/guix.git/plain/etc/guix-install.sh
          sudo bash guix-install.sh --unattended
          echo "/root/.config/guix/current/bin" | sudo tee -a /etc/environment
          echo "/var/guix/profiles/per-user/root/current-guix/bin" | sudo tee -a /etc/environment

      - name: Перевірити ключ підпису
        env:
          SIGNING_KEY: ${{ secrets.GUIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::Секрет GUIX_SIGNING_KEY не заданий."
            echo "Створіть ключ на своїй машині: sudo guix archive --generate-key"
            echo "Потім покладіть /etc/guix/signing-key.sec у секрет репозиторію."
            echo "Без ключа кеш буде непідписаним, і користувач не зможе його авторизувати."
            exit 1
          fi
          sudo install -d -m 700 /etc/guix
          printf '%s\n' "$SIGNING_KEY" | sudo tee /etc/guix/signing-key.sec >/dev/null
          sudo chmod 600 /etc/guix/signing-key.sec
          echo "ключ встановлено"

      - name: Зібрати пакети каналу
        run: |
          set -euo pipefail
          PACKAGES="${{ github.event.inputs.packages || 'wsm-tools' }}"
          echo "збираю: $PACKAGES"
          sudo -E /var/guix/profiles/per-user/root/current-guix/bin/guix build \
            --no-substitutes $PACKAGES | tee /tmp/store-paths.txt

      - name: Прогріти кеш
        # guix publish лінивий: він створює narinfo і nar на запит. Без прогріву
        # каталог кешу порожній, і публікувати нічого.
        run: |
          set -euo pipefail
          sudo -E /var/guix/profiles/per-user/root/current-guix/bin/guix publish \
            --cache=/var/cache/publish --port=3000 --compression=zstd:9 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/nix-cache-info >/dev/null && break
            sleep 1
          done
          while read -r path; do
            [ -n "$path" ] || continue
            hash=$(basename "$path" | cut -d- -f1)
            curl -sf "http://localhost:3000/${hash}.narinfo" >/dev/null || true
          done < /tmp/store-paths.txt
          sudo find /var/cache/publish -name '*.narinfo' | wc -l

      - name: Переписати URL на release assets
        run: |
          set -euo pipefail
          python3 scripts/narinfo_to_release_urls.py \
            --source /var/cache/publish \
            --destination ./site \
            --base-url "https://github.com/${{ github.repository }}/releases/download/substitutes"
          sudo cp /var/cache/publish/nix-cache-info ./site/ 2>/dev/null || true
          sudo cp /var/cache/publish/signing-key.pub ./site/ 2>/dev/null || true

      - name: Опублікувати архіви в реліз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view substitutes >/dev/null 2>&1 || \
            gh release create substitutes --title "Субститути каналу" \
              --notes "Архіви для статичного кешу субститутів. Метадані — у гілці gh-pages."
          sudo find /var/cache/publish/nar -name '*.nar.zst' -size -2000M | while read -r nar; do
            gh release upload substitutes "$nar" --clobber
          done

      - name: Викласти метадані на Pages
        id: deploy
        run: |
          set -euo pipefail
          touch ./site/.nojekyll
          echo "site готовий: $(find ./site -type f | wc -l) файлів"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - uses: actions/deploy-pages@v4
        id: pages
