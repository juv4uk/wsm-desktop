name: Субститути каналу — вимкнено до рішення власника

# SPDX-License-Identifier: LicenseRef-Volnist
#
# Цей workflow навмисно не виконує build або publication.
# Його попередня версія автоматично запускалася на push у main і могла
# розповсюдити WSM substitutes до закриття #367 та owner-рішення про ключ.
# Не знімати disabled guard до українського owner ADR, перевірки прав на
# розповсюдження, endpoint, key custody/rotation/revocation та явного trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ false }}
    name: Заблоковано до owner approval
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed
        run: |
          echo "::error::Публікацію substitutes вимкнено."
          echo "Потрібні: owner ADR українською, закритий #367 та узгоджені trust/key/endpoint рішення."
          exit 1
