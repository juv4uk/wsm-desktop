name: Guix substitutes — disabled by ADR 0010

# The owner-approved first publication lane is a manual guix pack draft.
# A long-lived substitute service requires a separately owner-managed signing key.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: false
    name: Вимкнено до окремого рішення власника щодо ключа підпису
    runs-on: ubuntu-24.04
    steps:
      - name: Пояснити стан
        run: |
          echo "Substitute publication is disabled by ADR 0010."
          echo "No signing key is generated, stored, or requested by this workflow."
          echo "Use the manual wsm-tools guix pack draft workflow for the approved package lane."
