name: Installer GUI build

concurrency:
  group: installer-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "installer/gui/**"
      - "wsm/packages/installer.scm"
      - "wsm/packages/wsm.scm"
      - "wsm_hwcheck/**"
      - "wsm_install/**"
      - "schemas/hardware-report.schema.json"
      - ".github/workflows/installer-gui.yml"
  push:
    branches:
      - main
    paths:
      - "installer/gui/**"
      - "wsm/packages/installer.scm"
      - "wsm/packages/wsm.scm"
      - "wsm_hwcheck/**"
      - "wsm_install/**"
      - "schemas/hardware-report.schema.json"
      - ".github/workflows/installer-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt6-build-and-qml-smoke:
    name: Qt 6 build, state tests, and offscreen QML smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 build and runtime modules
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake g++ \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qt6-qpa-plugins

      - name: Configure Qt application and workflow tests
        run: |
          cmake -S installer/gui -B build/wsm-installer \
            -DCMAKE_BUILD_TYPE=Release \
            -DWSM_BUILD_TESTS=ON

      - name: Compile C++ and QML resources
        run: cmake --build build/wsm-installer --parallel 2

      - name: Run C++ navigation state tests
        run: ctest --test-dir build/wsm-installer --output-on-failure

      - name: Verify QML application loads offscreen without hardware probing
        run: |
          QT_QPA_PLATFORM=offscreen \
          QT_QUICK_CONTROLS_STYLE=Basic \
            build/wsm-installer/wsm-installer --smoke-test
