name: Guix profile evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/guix-profile-evaluation.yml"
      - "channels.lock.scm"
      - "channels/**"
      - "systems/**/*.scm"
      - "wsm/**/*.scm"
      - "Makefile"
      - "scripts/build_iso.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guix-profile-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-locked-profiles:
    name: Evaluate every locked Guix System and Home profile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Install Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Evaluate profiles with authenticated channel locks
        run: |
          set -euo pipefail
          make check-guix-eval
