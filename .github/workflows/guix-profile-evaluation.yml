name: Guix profile evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/guix-profile-evaluation.yml"
      - ".github/workflows/trusted-ci-failure-reporter.yml"
      - ".guix-channel"
      - ".guix-authorizations"
      - "channels.lock.scm"
      - "tests/guix/**"
      - "docs/GUIX-CHANNEL.md"
      - "channels/**"
      - "systems/**/*.scm"
      - "wsm/**/*.scm"
      - "Makefile"
      - "scripts/build_iso.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guix-profile-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-locked-profiles:
    name: Evaluate every locked Guix System and Home profile
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # Кожен прогін `guix time-machine` інакше заново витягує checkout каналу.
      # Ключ — сам lock, тому зміна каналу природно інвалідовує кеш, а решта
      # прогонів його перевикористовує. Так робить Guix CI у Bitcoin Core.
      - name: Restore Guix checkout cache
        id: guix-checkouts
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkouts-${{ hashFiles('channels.lock.scm', 'channels/*.scm') }}
          restore-keys: guix-checkouts-

      - name: Install Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Evaluate pinned Guix profiles with local WSM source modules
        run: |
          set -euo pipefail
          make check-guix-eval
          echo "WSM_CHANNEL_AUTHENTICATION=NOT_TESTED" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the H170 GP107 kernel package on the exact Guix lock
        timeout-minutes: 240
        run: |
          set -euo pipefail
          echo "## H170 GP107 kernel package build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          df -h "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
          STORE_PATH="$(guix time-machine -C channels.lock.scm -- build -L "$GITHUB_WORKSPACE" --no-grafts linux-libre-h170)"
          test -d "$STORE_PATH"
          NAR_SHA256="$(guix hash --recursive --format=hex "$STORE_PATH")"
          {
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Guix lock | `channels.lock.scm` |"
            echo "| Package | `linux-libre-h170` |"
            echo "| Store path | `$STORE_PATH` |"
            echo "| NAR SHA-256 | `$NAR_SHA256` |"
            echo ""
            echo "This proves the package build only. It does not prove H170 boot, module binding, KMS, 3D, compute, or firmware availability."
            echo "No NAR export, release upload, substitute publication, firmware installation, or host-device passthrough is performed by this CI step."
          } >> "$GITHUB_STEP_SUMMARY"
          guix time-machine -C channels.lock.scm -- size "$STORE_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Save Guix checkout cache
        if: success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/guix/checkouts
          key: ${{ steps.guix-checkouts.outputs.cache-primary-key }}

      - name: Summarize Guix evaluation failure
        if: failure()
        run: |
          {
            echo "### Guix profile evaluation failed"
            echo "The first failing command and its exact output are in the preceding step logs."
            echo "WSM_CHANNEL_AUTHENTICATION=NOT_TESTED"
          } >> "$GITHUB_STEP_SUMMARY"
