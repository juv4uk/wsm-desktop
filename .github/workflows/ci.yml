name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml

      - name: Run unit and policy tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Check Free channel lock
        run: python scripts/check_channels.py --lock channels.lock.scm --policy free

      - name: Check Compatibility channel lock
        run: python scripts/check_channels.py --lock channels/compatibility.lock.scm --policy compatibility
