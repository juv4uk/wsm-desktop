name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml

      - name: Run unit and policy tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Check Scheme imports
        # Two builds failed at read time on a missing #:use-module; this catches
        # the known set without waiting twenty minutes for Guix.
        run: python scripts/check_scheme_imports.py

      - name: Check Free channel lock
        run: python scripts/check_channels.py --lock channels.lock.scm --policy free

      - name: Check Compatibility channel lock
        run: python scripts/check_channels.py --lock channels/compatibility.lock.scm --policy compatibility

      # Кожен скрипт, який `make check-*` запускає, мусить запускатися і тут.
      # Інакше перевірка існує лише на машині того, хто її додав, а зелений CI
      # означає менше, ніж обіцяє. Паритет тримає tests/test_ci_parity.py.
      - name: Check document ownership
        run: python scripts/check_doc_ownership.py

      - name: Check profile evidence
        run: python scripts/check_profile_evidence.py

      - name: Check release metadata
        run: python scripts/check_release_info.py

      # Логи задачі GitHub потребують авторизації: без цього кроку агент бачить
      # лише «Process completed with exit code 1» і витрачає прогін на вгадування.
      - name: Повідомити причину збою
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### fast checks: перевірки не пройшли"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Локально те саме відтворюється командою \`make check\`."
            echo "Нижче — хвіст виводу останніх кроків."
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null && echo "причину записано коментарем"
