name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml

      - name: Run unit and policy tests
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/unit-policy-tests.log"
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$LOG"
          result=${PIPESTATUS[0]}
          exit "$result"

      - name: Check documentation
        run: python scripts/check_docs.py

      - name: Check Scheme imports
        # Two builds failed at read time on a missing #:use-module; this catches
        # the known set without waiting twenty minutes for Guix.
        run: python scripts/check_scheme_imports.py

      - name: Check Scheme module coverage
        # The Guix evaluation test is the only place source modules are really
        # loaded. A module missing from it is evaluated by nobody, and the
        # evaluation keeps passing while covering less.
        run: python scripts/check_scheme_module_coverage.py

      - name: Test the Scheme module coverage checker
        run: python tests/test_scheme_module_coverage.py

      - name: Check Free channel lock
        run: python scripts/check_channels.py --lock channels.lock.scm --policy free

      - name: Check Compatibility channel lock
        run: python scripts/check_channels.py --lock channels/compatibility.lock.scm --policy compatibility

      - name: Report WSM channel bootstrap artifacts
        run: python scripts/check_channel_auth.py .

      # Кожен скрипт, який `make check-*` запускає, мусить запускатися і тут.
      # Інакше перевірка існує лише на машині того, хто її додав, а зелений CI
      # означає менше, ніж обіцяє. Паритет тримає tests/test_ci_parity.py.
      - name: Check document ownership
        run: python scripts/check_doc_ownership.py

      # The closure gate: `make check-tool-closure`. This step runs the checker's
      # own self-check against throwaway roots (pass on a complete root, a named
      # failure for a missing or non-executable tool, and `--prefix` mode for a
      # Guix-shaped root with no /usr). It does NOT verify the image: the runner's
      # filesystem is not the image, and the image ships neither /usr nor these
      # packages yet. Run `python scripts/check_tool_closure.py --root <image root>`
      # against a built image for that; the script says so on every pass.
      - name: Check installer tool closure
        run: python scripts/check_tool_closure.py --self-check

      - name: Check profile evidence
        run: python scripts/check_profile_evidence.py

      - name: Check release metadata
        run: python scripts/check_release_info.py

      # Keep PR workflows read-only; write failure details to the job summary.
      - name: Повідомити причину збою
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "### fast checks: перевірки не пройшли"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Локально те саме відтворюється командою \`make check\`."
            if [ -f "$RUNNER_TEMP/unit-policy-tests.log" ]; then
              echo ""
              echo "Останні 100 рядків unit/policy tests:"
              echo "----- unit/policy test log -----"
              tail -n 100 "$RUNNER_TEMP/unit-policy-tests.log"
              echo "----- end test log -----"
            else
              echo "Див. журнал попереднього невдалого кроку в цьому run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
