name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository checks
        run: |
          python -m unittest discover -s tests -v

  qemu-guest-smoke:
    name: Boot a minimal Linux guest with QEMU TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install isolated QEMU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gzip linux-image-generic
      - name: Boot minimal guest and verify serial marker
        run: bash scripts/ci_qemu_guest_smoke.sh
