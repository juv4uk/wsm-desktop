name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }} / repository checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run documented repository check
        run: make check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  qemu-guest-smoke:
    name: Boot a minimal Linux guest with QEMU TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install isolated QEMU test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gzip
      - name: Boot minimal guest and verify serial marker
        run: bash scripts/ci_qemu_guest_smoke.sh

  qemu-harness-integration:
    name: Boot a synthetic ISO through the WSM QEMU harness
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install isolated QEMU harness integration tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 qemu-utils \
            grub-common grub-pc-bin xorriso mtools \
            busybox-static cpio gzip
      - name: Run harness tests with the real QEMU CLI
        run: python -m unittest discover -s tests -p 'test_qemu_boot_smoke.py' -v
      - name: Boot a synthetic ISO through the project harness
        run: bash scripts/ci_qemu_harness_iso_integration.sh
