name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python ${{ matrix.python-version }} / repository checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run documented repository check
        run: make check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  qemu-guest-smoke:
    name: Boot a minimal Linux guest with QEMU TCG
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install isolated QEMU guest-smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gzip
      - name: Boot minimal guest and verify serial marker
        run: bash scripts/ci_qemu_guest_smoke.sh

  cxl-qemu-capability-probe:
    name: CXL QEMU model and kernel capability probe
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'research/cxl-qemu-probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install QEMU and kernel module inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 kmod
      - name: Record read-only CXL runner capabilities
        run: bash scripts/ci_probe_qemu_cxl.sh
