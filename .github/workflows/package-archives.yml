name: WSM package archives

# Fail-closed stub. The previous version accepted arbitrary package names via
# workflow_dispatch and interpolated them into Bash. Do not export Guix NARs
# until the fixed H170 allowlist, signing-key custody, source provenance and
# draft-release policy have all passed review.
#
# The safe upstream-only build/evidence workflow is hw-build-evidence.yml. It
# is manual-only on main and records derivation/NAR hashes without exporting
# or uploading package archives.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsm-package-archives
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ false }}
    name: Disabled pending fixed allowlist and archive-signing decision
    runs-on: ubuntu-24.04
    steps:
      - name: Archive publication is not authorized
        run: |
          echo "NOT_AUTHORIZED: Guix archive exports are signed and require an explicitly trusted key"
          exit 1
