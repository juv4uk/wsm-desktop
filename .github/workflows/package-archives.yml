# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM package archives

# Owner-authorized, manually triggered pack for the WSM-owned wsm-tools package.
# This is not the upstream H170 Free substitute cache.
on:
  workflow_dispatch:
    inputs:
      attach_to_draft:
        description: "Optional existing Draft Release tag; empty keeps an Actions artifact only"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: wsm-package-archives
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build and pack wsm-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the GNU Guix project's authenticated Codeberg mirror
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://codeberg.org/guix/guix.git".insteadOf "https://git.guix.gnu.org/guix.git"
          echo "Guix fetch transport uses the project's Codeberg mirror; the lock and authentication remain unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Evaluate and build the WSM package pack on the locked Guix
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives
          pack_output="$(guix time-machine -C channels.lock.scm -- \
            pack -L "$GITHUB_WORKSPACE" --format=tarball -C gzip \
            --symlink=/opt/wsm/bin=bin \
            --expression='(begin (use-modules (wsm packages wsm)) wsm-tools)' \
            --no-grafts)"
          pack_store_path="$(printf '%s\n' "$pack_output" | tail -n 1)"
          case "$pack_store_path" in
            /gnu/store/*.tar.gz|/gnu/store/*.tar.zst) ;;
            *) echo "refusing unexpected Guix pack output: $pack_store_path" >&2; exit 1 ;;
          esac
          test -f "$pack_store_path"
          output="archives/wsm-tools-${GITHUB_SHA:0:12}.tar.gz"
          cp -- "$pack_store_path" "$output"
          cp -- LICENSE archives/LICENSE
          guix time-machine -C channels.lock.scm -- describe -f channels > archives/guix-channels.txt
          {
            echo "Package: wsm-tools"
            echo "Package version: 0.1.0-rc6"
            echo "Source commit: $GITHUB_SHA"
            echo "Guix version: $(guix --version | head -n1)"
            echo "Channel lock SHA-256: $(sha256sum channels.lock.scm | cut -d ' ' -f1)"
            echo "Pack file: $(basename "$output")"
            echo "Pack SHA-256: $(sha256sum "$output" | cut -d ' ' -f1)"
            echo "Package metadata license: LicenseRef-Volnist (file://LICENSE)"
            echo "The exact LICENSE text is attached as a separate asset and embedded under share/doc/wsm-tools."
            echo "No OSI or GNU FSDG classification is claimed."
            echo "This is a self-contained Guix pack, not a substitute cache."
          } > archives/PROVENANCE.txt
          (
            cd archives
            sha256sum "$(basename "$output")" LICENSE guix-channels.txt PROVENANCE.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          echo "pack_path=$output" >> "$GITHUB_OUTPUT"
          cat archives/PROVENANCE.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the pack contains the WSM commands and license
        run: |
          set -euo pipefail
          pack="${{ steps.build.outputs.pack_path }}"
          listing="$(tar -tzf "$pack")"
          printf '%s\n' "$listing" | grep -E '/bin/wsm-hwcheck$'
          printf '%s\n' "$listing" | grep -E '/bin/wsm-install$'
          printf '%s\n' "$listing" | grep -E '/bin/wsm-install-live$'
          printf '%s\n' "$listing" | grep -E '/share/doc/wsm-tools/LICENSE$'

      - name: Attest the exact package and provenance files
        uses: actions/attest@v4
        with:
          subject-path: |
            archives/*.tar.gz
            archives/LICENSE
            archives/SHA256SUMS
            archives/guix-channels.txt
            archives/PROVENANCE.txt

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wsm-tools-pack-${{ github.sha }}
          path: |
            archives/*.tar.gz
            archives/LICENSE
            archives/SHA256SUMS
            archives/guix-channels.txt
            archives/PROVENANCE.txt
          retention-days: 30
          if-no-files-found: error

      - name: Note that no Draft Release was requested
        if: inputs.attach_to_draft == ''
        run: |
          {
            echo "No Draft Release was requested; the verified package remains a 30-day Actions artifact."
            echo "WSM_PACKAGE_ATTACHED_TO=none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the pack to an explicitly named existing Draft Release
        if: inputs.attach_to_draft != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.attach_to_draft }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "refusing: $TAG is not a Draft Release" >&2
            exit 1
          fi
          gh release upload "$TAG" archives/*.tar.gz archives/LICENSE archives/SHA256SUMS \
            archives/guix-channels.txt archives/PROVENANCE.txt --clobber
          mkdir -p "$RUNNER_TEMP/wsm-pack-readback"
          gh release download "$TAG" --dir "$RUNNER_TEMP/wsm-pack-readback"
          cp archives/SHA256SUMS "$RUNNER_TEMP/wsm-pack-readback/SHA256SUMS.expected"
          (
            cd "$RUNNER_TEMP/wsm-pack-readback"
            sha256sum -c SHA256SUMS.expected
          )
          echo "WSM_PACKAGE_ATTACHED_TO=$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report package build or publication failure
        if: failure()
        run: |
          {
            echo "## WSM wsm-tools pack failed"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "No successful package publication is claimed."
          } >> "$GITHUB_STEP_SUMMARY"
