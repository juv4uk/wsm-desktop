# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM package archives — вимкнено до licensing decision

# Тут може з'явитися лише ручне створення ephemeral build evidence.
# Пакет/NAR не можна експортувати в Actions artifacts або draft/public releases,
# доки власник не вирішить #367 і права на розповсюдження.
#
# Поточна версія навмисно не будує, не експортує і не завантажує wsm-tools.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: ${{ false }}
    name: Заблоковано до рішення #367
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed
        run: |
          echo "::error::Package archive workflow вимкнено до licensing decision #367."
          exit 1
