# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM package archives
# ADR 0010: власний пакет WSM, ручний запуск, лише Draft Release, без signing key.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wsm-package-archives
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    name: Build and pack wsm-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version
      - name: Evaluate and build the WSM package pack
        id: build-pack
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/archives"
          mkdir -p "$OUT"
          cp channels.lock.scm "$OUT/channels.lock.scm"
          cp wsm/packages/wsm.scm "$OUT/wsm-package-definition.scm"
          cp LICENSE "$OUT/LICENSE"
          guix time-machine -C channels.lock.scm -- describe > "$OUT/guix-channel-description.txt"
          ( cd "$OUT" && sha256sum channels.lock.scm wsm-package-definition.scm LICENSE > CHANNEL-INPUTS.sha256 )

          PACK_LOG="$OUT/guix-pack.stdout"
          PACK_ERR="$OUT/guix-pack.stderr"
          guix time-machine -C channels.lock.scm -- \
            pack -L . --format=tarball \
            --symlink=/opt/wsm/bin=bin \
            --expression='(begin (use-modules (wsm packages wsm)) wsm-tools)' \
            --no-grafts > "$PACK_LOG" 2> "$PACK_ERR"

          PACK_PATH="$(tail -n 1 "$PACK_LOG" | tr -d '\r')"
          case "$PACK_PATH" in
            /gnu/store/*-pack.tar.gz) ;;
            *)
              echo "Guix pack did not return a valid store tarball path: $PACK_PATH" >&2
              cat "$PACK_LOG" "$PACK_ERR" >&2
              exit 1
              ;;
          esac
          test -s "$PACK_PATH"

          cp -- "$PACK_PATH" "$OUT/wsm-tools-pack.tar.gz"
          tar -tzf "$OUT/wsm-tools-pack.tar.gz" > "$OUT/pack-contents.txt"
          for command in wsm-hwcheck wsm-install wsm-install-live; do
            grep -Eq "(^|/)${command}$" "$OUT/pack-contents.txt" || {
              echo "Guix pack is missing expected command: $command" >&2
              exit 1
            }
          done

          {
            echo "WSM package: wsm-tools"
            echo "Source commit: $GITHUB_SHA"
            echo "Repository: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "Guix version: $(guix --version | head -n 1)"
            echo "Pinned channel: channels.lock.scm"
            echo "Package definition: wsm/packages/wsm.scm"
            echo "License: LicenseRef-Volnist; LICENSE included"
            echo "Pack store path: $PACK_PATH"
            echo "Pack format: tarball with runtime closure"
            echo "Commands verified: wsm-hwcheck, wsm-install, wsm-install-live"
            echo "Signing key: not used (ADR 0010)"
            echo "Substitute service: not used (ADR 0010)"
          } > "$OUT/PROVENANCE.txt"

          (
            cd "$OUT"
            sha256sum wsm-tools-pack.tar.gz channels.lock.scm \
              wsm-package-definition.scm LICENSE CHANNEL-INPUTS.sha256 \
              guix-channel-description.txt pack-contents.txt PROVENANCE.txt \
              > SHA256SUMS
          )

          cat > "$OUT/RELEASE-NOTES.md" <<'EOF'
          # WSM Guix package — draft

          This draft contains the WSM-owned wsm-tools package packed with its runtime
          dependencies by the pinned GNU Guix channel lock. It is not a substitute
          cache and does not contain third-party kernel, Mesa, Nonguix, or firmware
          packages. The release remains a draft and is not publicly published.
          See PROVENANCE.txt and SHA256SUMS before using the archive.
          EOF

          {
            echo "## WSM package pack"
            echo ""
            cat "$OUT/PROVENANCE.txt"
            echo ""
            echo "### SHA256"
            cat "$OUT/SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create a draft release and verify read-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/archives"
          RELEASE_TAG="wsm-tools-draft-${GITHUB_RUN_NUMBER}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$OUT/wsm-tools-pack.tar.gz" \
            "$OUT/channels.lock.scm" \
            "$OUT/wsm-package-definition.scm" \
            "$OUT/LICENSE" \
            "$OUT/CHANNEL-INPUTS.sha256" \
            "$OUT/guix-channel-description.txt" \
            "$OUT/pack-contents.txt" \
            "$OUT/PROVENANCE.txt" \
            "$OUT/SHA256SUMS" \
            --title "WSM wsm-tools (draft ${GITHUB_RUN_NUMBER})" \
            --notes-file "$OUT/RELEASE-NOTES.md" \
            --draft \
            --target "$GITHUB_SHA"

          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          test "$IS_DRAFT" = "true"
          READBACK="$RUNNER_TEMP/wsm-tools-readback"
          mkdir -p "$READBACK"
          gh release download "$RELEASE_TAG" --dir "$READBACK"
          (
            cd "$READBACK"
            sha256sum -c SHA256SUMS
            tar -tzf wsm-tools-pack.tar.gz >/dev/null
          )
          echo "Draft $RELEASE_TAG created and read-back verified." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report the exact failure without claiming publication
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "### WSM package archive failed"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "No successful package build or release is claimed."
            echo ""
            ls -lah archives 2>&1 || true
            df -h / || true
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="WSM wsm-tools package archive failed. Inspect $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null || true
