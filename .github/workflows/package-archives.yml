# SPDX-License-Identifier: LicenseRef-Volnist
name: H170 Free Guix package publication

# Publishes only the fixed upstream H170 Free roots. WSM-owned packages and
# nonfree firmware are intentionally outside this archive.
on:
  push:
    tags:
      - "packages-h170-free-*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: h170-free-package-publication
  cancel-in-progress: false

jobs:
  archive:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/packages-h170-free-')
    name: Build, attest and publish the H170 Free package closure
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate the publication ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$REF" = "refs/heads/main" || {
              echo "manual publication is allowed only from main" >&2
              exit 1
            }
          elif [[ "$REF" == refs/tags/packages-h170-free-* ]]; then
            git merge-base --is-ancestor "$SHA" origin/main || {
              echo "publication tag must point to a commit reachable from main" >&2
              exit 1
            }
          else
            echo "unsupported publication ref: $REF" >&2
            exit 1
          fi

      - name: Install Guix and archive compression
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix zstd
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Build the fixed H170 Free roots on the official lock
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/archives"
          mkdir -p "$OUT"
          cp channels.lock.scm "$OUT/channels.lock.scm"
          guix time-machine -C channels.lock.scm -- describe > "$OUT/guix-channel-description.txt"
          ( cd "$OUT" && sha256sum channels.lock.scm > channels.lock.sha256 )

          PACKAGES=(linux-libre mesa)
          STORE_PATHS=()
          printf 'package\tstore_path\tnar_sha256\n' > "$OUT/store-paths.tsv"

          for package in "${PACKAGES[@]}"; do
            store_path="$(guix time-machine -C channels.lock.scm -- build --no-grafts "$package")"
            case "$store_path" in
              /gnu/store/*) ;;
              *) echo "unexpected store path for $package: $store_path" >&2; exit 1 ;;
            esac
            STORE_PATHS+=("$store_path")
            nar_sha256="$(guix time-machine -C channels.lock.scm -- hash --recursive --format=hex "$store_path")"
            printf '%s\t%s\t%s\n' "$package" "$store_path" "$nar_sha256" >> "$OUT/store-paths.tsv"
          done

          guix time-machine -C channels.lock.scm -- size "${STORE_PATHS[@]}" > "$OUT/store-closure-size.txt"
          {
            echo "## H170 Free package build"
            echo ""
            echo "Roots: linux-libre, mesa (official Guix channel only)"
            echo ""
            cat "$OUT/store-paths.tsv"
            echo ""
            cat "$OUT/store-closure-size.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate an ephemeral Guix archive key and export the recursive closure
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/archives"
          if ! sudo test -s /etc/guix/signing-key.sec || ! sudo test -s /etc/guix/signing-key.pub; then
            sudo guix archive --generate-key
          fi
          sudo test -s /etc/guix/signing-key.sec
          sudo test -s /etc/guix/signing-key.pub
          sudo install -m 0644 /etc/guix/signing-key.pub "$OUT/signing-key.pub"

          mapfile -t STORE_PATHS < <(cut -f2 "$OUT/store-paths.tsv" | tail -n +2)
          test "${#STORE_PATHS[@]}" -eq 2
          guix time-machine -C channels.lock.scm -- archive --export --recursive "${STORE_PATHS[@]}" > "$OUT/h170-free-closure.nar"
          test -s "$OUT/h170-free-closure.nar"

          zstd -T0 -19 --rm "$OUT/h170-free-closure.nar"
          split -b 1800M -d -a 3 \
            "$OUT/h170-free-closure.nar.zst" \
            "$OUT/h170-free-closure.nar.zst.part-"
          rm "$OUT/h170-free-closure.nar.zst"

          cat "$OUT"/h170-free-closure.nar.zst.part-* | sha256sum | awk '{print $1}' > "$OUT/bundle.sha256"
          cat "$OUT"/h170-free-closure.nar.zst.part-* | wc -c | tr -d ' ' > "$OUT/bundle.size-bytes"

          {
            echo "WSM repository: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "WSM source commit: $GITHUB_SHA"
            echo "Package profile: H170 Free"
            echo "Package roots: linux-libre, mesa"
            echo "Package source: pinned official GNU Guix channel in channels.lock.scm"
            echo "WSM-owned packages: excluded"
            echo "NVIDIA/Intel nonfree firmware and Nonguix: excluded"
            echo "Guix archive signature: ephemeral runner daemon key; public key is signing-key.pub"
            echo "Recursive closure bundle SHA-256: $(cat "$OUT/bundle.sha256")"
            echo "Compressed bundle size (bytes): $(cat "$OUT/bundle.size-bytes")"
            echo ""
            echo "Pinned Guix channel description:"
            cat "$OUT/guix-channel-description.txt"
            echo ""
            echo "Package store paths and recursive NAR hashes:"
            cat "$OUT/store-paths.tsv"
            echo ""
            echo "Store and closure size:"
            cat "$OUT/store-closure-size.txt"
          } > "$OUT/provenance.txt"

          cat > "$OUT/IMPORT.md" <<'EOF'
          # Import the H170 Free Guix package closure

          Verify all downloaded assets first:

              sha256sum -c SHA256SUMS

          Authorize the one-run public key included as signing-key.pub, then import
          the signed archive bundle:

              sudo guix archive --authorize < signing-key.pub
              cat h170-free-closure.nar.zst.part-* | zstd -dc | guix archive --import

          The archive contains the recursive closures for the linux-libre and mesa
          roots. The private signing key was generated on the ephemeral build runner
          and is not included in this release.
          EOF

          cat > "$OUT/RELEASE-NOTES.md" <<'EOF'
          # H170 Free Guix package bundle

          This prerelease contains the Guix-built upstream package roots linux-libre
          and mesa, resolved from the official channel pinned by channels.lock.scm.
          The attached NAR bundle includes their recursive store closure and is signed
          by a one-run Guix daemon key; signing-key.pub is provided for import trust.
          GitHub artifact provenance is attached to the compressed archive parts.

          This is package build and closure evidence, not H170 hardware certification.
          The current pinned linux-libre candidate has a known GP107 Nouveau atomic-KMS
          regression window. The separate linux-libre-h170 backport is not included
          until its own exact-lock evaluation and full package build pass.
          No NVIDIA FECS/GPCCS firmware, Intel nonfree firmware or microcode, Nonguix,
          proprietary NVIDIA driver, or WSM-owned LicenseRef-Volnist package is included.
          GP107 3D/compute and physical H170 runtime are not claimed.

          See IMPORT.md, provenance.txt, store-paths.tsv and SHA256SUMS.
          EOF

          (
            cd "$OUT"
            sha256sum \
              h170-free-closure.nar.zst.part-* \
              signing-key.pub \
              channels.lock.scm \
              channels.lock.sha256 \
              guix-channel-description.txt \
              store-paths.tsv \
              store-closure-size.txt \
              bundle.sha256 \
              bundle.size-bytes \
              provenance.txt \
              IMPORT.md \
              > SHA256SUMS
          )

      - name: Generate GitHub build provenance
        uses: actions/attest@v4
        with:
          subject-path: archives/h170-free-closure.nar.zst.part-*

      - name: Publish a versioned prerelease and verify its read-back
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/archives"
          if [[ "$REF" == refs/tags/* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
          else
            RELEASE_TAG="h170-free-${SHA:0:12}"
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to overwrite an existing release: $RELEASE_TAG" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "$OUT"/h170-free-closure.nar.zst.part-* \
            "$OUT/signing-key.pub" \
            "$OUT/channels.lock.scm" \
            "$OUT/channels.lock.sha256" \
            "$OUT/guix-channel-description.txt" \
            "$OUT/store-paths.tsv" \
            "$OUT/store-closure-size.txt" \
            "$OUT/bundle.sha256" \
            "$OUT/bundle.size-bytes" \
            "$OUT/provenance.txt" \
            "$OUT/IMPORT.md" \
            "$OUT/SHA256SUMS" \
            --title "H170 Free Guix packages ($RELEASE_TAG)" \
            --notes-file "$OUT/RELEASE-NOTES.md" \
            --prerelease \
            --target "$SHA"

          READBACK="$RUNNER_TEMP/h170-free-readback"
          mkdir -p "$READBACK"
          gh release download "$RELEASE_TAG" --dir "$READBACK"
          (
            cd "$READBACK"
            sha256sum -c SHA256SUMS
            ACTUAL_BUNDLE_SHA="$(cat h170-free-closure.nar.zst.part-* | sha256sum | awk '{print $1}')"
            EXPECTED_BUNDLE_SHA="$(cat bundle.sha256)"
            test "$ACTUAL_BUNDLE_SHA" = "$EXPECTED_BUNDLE_SHA"
            cat h170-free-closure.nar.zst.part-* | zstd -dc > /dev/null
          )
          echo "Published and verified prerelease: $RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY="$(mktemp)"
          {
            echo "### H170 Free Guix package publication failed"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "No successful publication is claimed. Inspect the exact failed workflow step."
            echo ""
            echo "#### available archive files"
            ls -lah archives 2>&1 || true
            echo ""
            df -h / || true
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null || true
