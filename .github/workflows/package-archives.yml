# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM H170 Free package archives

on:
  push:
    tags:
      - "packages-*"
  workflow_dispatch:
    inputs:
      packages:
        description: "H170 Free package roots (space-separated); empty uses the fixed manifest"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: wsm-h170-free-package-archives
  cancel-in-progress: false

jobs:
  archive:
    name: Build and publish the locked H170 Free package set
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GNU Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Build package roots on the exact release lock
        env:
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h170-free-archives"
          OUT="$RUNNER_TEMP/h170-free-archives"
          : > "$OUT/store-paths.txt"
          ALLOWED="mesa vulkan-loader vulkan-tools pciutils usbutils alsa-utils ethtool nvme-cli smartmontools lm-sensors"
          if [ -n "$PACKAGES" ]; then
            read -r -a PACKAGE_ARRAY <<< "$PACKAGES"
            for package in "${PACKAGE_ARRAY[@]}"; do
              case "$package" in
                *[!A-Za-z0-9._+-]*) echo "refusing odd package name: $package" >&2; exit 1 ;;
              esac
              case " $ALLOWED " in
                *" $package "*) ;;
                *) echo "refusing package outside the H170 Free allowlist: $package" >&2; exit 1 ;;
              esac
              store_path="$(guix time-machine -C channels.lock.scm -- build -L . "$package" --no-grafts)"
              printf '%s\n' "$store_path" >> "$OUT/store-paths.txt"
            done
          else
            guix time-machine -C channels.lock.scm -- build -L . --no-grafts \
              --manifest="$GITHUB_WORKSPACE/drivers/profiles/h170-free-packages.scm" \
              > "$OUT/store-paths.txt"
          fi
          mapfile -t STORE_PATHS < "$OUT/store-paths.txt"
          test "${#STORE_PATHS[@]}" -gt 0
          {
            echo "## H170 Free package roots"
            echo ""
            echo "| Store output | Store path | NAR SHA-256 | Bytes |"
            echo "|---|---|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for store_path in "${STORE_PATHS[@]}"; do
            test -d "$store_path"
            output_name="${store_path##*/}"
            nar_sha256="$(guix hash --recursive --format=hex "$store_path")"
            bytes="$(du -sb "$store_path" | cut -f1)"
            printf '| `%s` | `%s` | `%s` | %s |\n' \
              "$output_name" "$store_path" "$nar_sha256" "$bytes" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate an ephemeral archive signing key
        run: |
          set -euo pipefail
          sudo install -d -m 700 /etc/guix
          sudo guix archive --generate-key
          test -s /etc/guix/signing-key.sec
          test -s /etc/guix/signing-key.pub
          sudo install -m 0644 /etc/guix/signing-key.pub \
            "$RUNNER_TEMP/h170-free-archives/signing-key.pub"

      - name: Export signed package-root NARs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/h170-free-archives"
          while IFS= read -r store_path; do
            test -d "$store_path"
            output_name="${store_path##*/}"
            sudo guix archive --export "$store_path" > "$OUT/$output_name.nar"
            bytes="$(stat -c '%s' "$OUT/$output_name.nar")"
            if [ "$bytes" -ge 1900000000 ]; then
              echo "NAR exceeds the GitHub Release per-asset safety limit: $output_name ($bytes bytes)" >&2
              exit 1
            fi
          done < "$OUT/store-paths.txt"
          cp drivers/profiles/h170-free-packages.scm "$OUT/"
          {
            echo "WSM source commit: $GITHUB_SHA"
            echo "Guix channel commit: 4e5195be20d9b124df8a8bb69213412236e4668e"
            echo "Manifest: drivers/profiles/h170-free-packages.scm"
            echo "NARs contain package roots only; dependency closure is fetched from official Guix substitutes."
            echo "Archive signing key is ephemeral to this isolated workflow run; private key is never uploaded."
            echo "Not included: WSM-owned tools, Nonguix, proprietary NVIDIA driver, NVIDIA firmware, Intel microcode."
          } > "$OUT/provenance.txt"
          (
            cd "$OUT"
            sha256sum *.nar signing-key.pub h170-free-packages.scm store-paths.txt provenance.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish a versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/h170-free-archives"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="h170-free-packages-$SHORT_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          cat > "$OUT/RELEASE-NOTES.md" <<EOF
          # WSM H170 Free package roots

          Built against official Guix lock 4e5195be20d9b124df8a8bb69213412236e4668e.

          This release contains signed NAR archives for the fixed H170 Free upstream package set, checksums, provenance, the package manifest, and the ephemeral public archive key.

          ## Import

          Inspect provenance.txt and SHA256SUMS. Authorize the attached run-specific public key, then import each desired package root:

              guix archive --authorize < signing-key.pub
              guix archive --import < package-output.nar

          The NARs contain package roots, not recursive dependency closures. Missing dependencies are fetched through the official Guix substitute servers.

          No WSM-owned tools, Nonguix, proprietary NVIDIA driver, NVIDIA firmware, or Intel microcode is included. The custom linux-libre-h170 kernel overlay is released separately.
          EOF
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS
          )
          gh release create "$TAG" "$OUT"/*.nar "$OUT"/signing-key.pub \
            "$OUT"/h170-free-packages.scm "$OUT"/store-paths.txt \
            "$OUT"/provenance.txt "$OUT"/SHA256SUMS "$OUT"/RELEASE-NOTES.md \
            --title "WSM H170 Free packages ($SHORT_SHA)" \
            --notes-file "$OUT/RELEASE-NOTES.md" --target "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/h170-free-readback"
          gh release download "$TAG" --dir "$RUNNER_TEMP/h170-free-readback"
          (
            cd "$RUNNER_TEMP/h170-free-readback"
            sha256sum -c SHA256SUMS
          )
          echo "Published release: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### H170 Free package archive publication failed"
            echo "Commit: $GITHUB_SHA"
            echo "Exact failure details are in this workflow run's logs."
            echo "No success is claimed."
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="H170 Free package publication failed. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
