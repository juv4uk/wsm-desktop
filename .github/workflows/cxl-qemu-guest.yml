name: CXL Linux guest sysfs feasibility

on:
  pull_request:
    paths:
      - ".github/workflows/cxl-qemu-guest.yml"
      - "scripts/ci_cxl_qemu_guest.py"
      - "tests/test_cxl_qemu_guest.py"
      - "scripts/qemu_boot_smoke.py"
      - "tests/test_qemu_boot_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cxl-sysfs-guest:
    name: Enumerate an emulated CXL Type 3 device in a disposable guest
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install QEMU and initramfs tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 busybox-static cpio zstd xz-utils kmod

      - name: Run shared bounded process helper tests
        run: python3 -m unittest discover -s tests -p "test_qemu_boot_smoke.py" -v

      - name: Run host-side parser and policy tests
        run: python3 -m unittest discover -s tests -p "test_cxl_qemu_guest.py" -v

      - name: Boot the runner kernel and inspect guest CXL sysfs
        run: python3 scripts/ci_cxl_qemu_guest.py --timeout 90