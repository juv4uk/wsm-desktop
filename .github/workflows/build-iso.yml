name: Build live ISO

# Building an image needs Guix, which no development machine here has. A runner
# does. Pushing to a `build/**` branch is the trigger: it needs no extra API
# permission, and it keeps image builds away from ordinary pull requests.

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

# contents: write is needed only to publish the release from the workflow's own
# token. It is the workflow token, not the app token used during development.
permissions:
  contents: write

jobs:
  minimal:
    name: minimal console ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Guix from the release tarball
        run: |
          set -euo pipefail
          # guix-install.sh is served by Savannah cgit, which refuses automated
          # clients (wget exit 8), and the GitHub mirror path 404s. The release
          # tarball is the documented manual install and has no such dependency.
          VERSION=1.5.0
          wget -q "https://ftp.gnu.org/gnu/guix/guix-binary-${VERSION}.x86_64-linux.tar.xz"
          tar -xf "guix-binary-${VERSION}.x86_64-linux.tar.xz"

          sudo mkdir -p /var/guix /gnu
          sudo mv var/guix/* /var/guix/
          sudo mv gnu/* /gnu/

          sudo groupadd --system guixbuild || true
          for i in $(seq -w 1 10); do
            sudo useradd -g guixbuild -G guixbuild -d /var/empty -s "$(command -v nologin)" \
              -c "Guix build user $i" --system "guixbuilder$i" || true
          done

          sudo ln -sf /var/guix/profiles/per-user/root/current-guix/bin/guix /usr/local/bin/guix
          sudo /usr/local/bin/guix archive --authorize \
            < /var/guix/profiles/per-user/root/current-guix/share/guix/ci.guix.gnu.org.pub

          sudo /var/guix/profiles/per-user/root/current-guix/bin/guix-daemon \
            --build-users-group=guixbuild --disable-chroot &
          sleep 5
          guix --version

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf

      - name: Build the image from the pinned channels
        run: |
          set -uo pipefail
          export PATH="/usr/local/bin:$PATH"
          mkdir -p build
          # -L "$PWD" is not optional: the profile imports (wsm packages wsm),
          # which lives in this repository, not in the Guix channel.
          guix time-machine -C channels.lock.scm -- \
            system image --image-type=iso9660 -L "$PWD" \
            systems/live-minimal.scm > build/build.log 2>&1
          status=$?
          while IFS= read -r line; do printf '::error::BUILD %s\n' "$line"; done < <(tail -60 build/build.log)
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tail -n1 build/build.log > build/image-path.txt
          cat build/image-path.txt
          IMAGE=$(tail -n1 build/image-path.txt)
          cp "$IMAGE" build/wsm-desktop-minimal.iso
          ls -la build/wsm-desktop-minimal.iso

      - name: Diagnostics on failure
        if: failure()
        run: |
          {
            echo "## Build diagnostics"
            echo ""
            echo "### guix"
            /usr/local/bin/guix --version || true
            echo ""
            echo "### guix-daemon"
            sudo systemctl status guix-daemon --no-pager 2>&1 | head -20 || true
            sudo tail -30 /var/log/guix-daemon.log 2>&1 || true
            echo ""
            echo "### build.log (tail)"
            echo '```'
            tail -60 build/build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "diagnostics written to the step summary"

      - name: Verify the image
        run: |
          set -euo pipefail
          python3 -m pip install --quiet 'jsonschema[format]==4.26.0' pyyaml
          python3 scripts/verify_live_release.py \
            --iso build/wsm-desktop-minimal.iso \
            --boot \
            --ovmf-code /usr/share/OVMF/OVMF_CODE.fd \
            --output build/verdict.json || true
          cat build/verdict.json

      - name: Upload the image and the verdict
        uses: actions/upload-artifact@v4
        with:
          name: wsm-desktop-minimal-iso
          path: |
            build/wsm-desktop-minimal.iso
            build/verdict.json
          retention-days: 7
          if-no-files-found: error

      - name: Split the image for release upload
        run: |
          set -euo pipefail
          cd build
          # GitHub caps a release asset at 2 GB, so the image is published as
          # parts with a checksum file and a reassembly script - the same shape
          # the previous ISO release used.
          split -b 1900M -d -a 3 wsm-desktop-minimal.iso wsm-desktop-minimal.iso.part
          sha256sum wsm-desktop-minimal.iso > ISO-CHECKSUMS.sha256
          cp ../scripts/reassemble-iso.sh .
          ls -la

      - name: Publish the parts as a pre-release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="iso-minimal-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "WSM minimal live ISO $TAG" \
            --notes "Built from commit $GITHUB_SHA by the Build live ISO workflow. The verdict next to the parts says what was verified and what was not." \
            build/wsm-desktop-minimal.iso.part* \
            build/ISO-CHECKSUMS.sha256 \
            build/verdict.json \
            build/reassemble-iso.sh
          echo "::notice::published $TAG"
