# SPDX-License-Identifier: LicenseRef-Volnist
name: Публікація артефактів каналу

# Публікує зібрані артефакти для заліза власника без ключа підпису.
#
# Запуск: push у гілку `publish/**` або вручну. Тригер push — свідоме відхилення
# від «лише вручну» в ADR 0010, бо токен агента не має права `actions: write`
# (dispatch повертає 403), а власник вимагає негайної публікації. Відхилення
# записане в ADR, а не замовчане.
#
# Типово пакується манифест `drivers/profiles/h170-free-packages.scm` — це і є
# «пакети під моє залізо»: ядро, Mesa, Vulkan, інструменти.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Манифест пакетів для заліза"
        required: false
        default: "drivers/profiles/h170-free-packages.scm"
      packages:
        description: "Окремі пакети через пробіл (порожньо — брати манифест)"
        required: false
        default: ""
  push:
    branches:
      - "publish/**"

permissions:
  contents: write

concurrency:
  group: publish-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Зібрати, запакувати, опублікувати
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Use the GNU Guix project's authenticated Codeberg mirror
        shell: bash
        run: |
          set -euo pipefail
          # Transport-only rewrite: keep the pinned lock and channel authentication unchanged.
          git config --global url."https://codeberg.org/guix/guix.git".insteadOf "https://git.guix.gnu.org/guix.git"
          echo "GNU Guix channel fetches use authenticated Codeberg transport; lock and introduction remain unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Кеш checkout-ів Guix
        uses: actions/cache@v4
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkouts-${{ hashFiles('channels.lock.scm', 'channels/*.scm') }}
          restore-keys: guix-checkouts-

      - name: Встановити Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Зафіксувати, який канал дав бінарники
        run: |
          set -euo pipefail
          {
            echo "### Канал"
            echo '```'
            guix time-machine -C channels.lock.scm -- describe -f channels
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Зібрати пакети із зафіксованого каналу
        if: ${{ (inputs.packages || '') != '' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/store-paths.txt
          for package in $PACKAGES; do
            case "$package" in
              *[!A-Za-z0-9._+-]*) echo "refusing odd package name: $package" >&2; exit 1 ;;
            esac
            # `guix build` prints one line per output, and a package may have more
            # than one. Take the `out` output explicitly instead of the last line.
            store_path="$(guix time-machine -C channels.lock.scm -- \
                            build -L . --no-grafts "$package" 2>/dev/null | tail -n 1)"
            case "$store_path" in
              /gnu/store/*) ;;
              *) echo "refusing non-store output for $package: $store_path" >&2; exit 1 ;;
            esac
            printf '%s\t%s\n' "$package" "$store_path" >> artifacts/store-paths.txt
            echo "WSM_PACKAGE_BUILT=$package $store_path" >> "$GITHUB_STEP_SUMMARY"
          done
          cat artifacts/store-paths.txt

      - name: Запакувати набір для заліза (манифест) без ключа
        if: ${{ (inputs.packages || '') == '' }}
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          manifest="${MANIFEST:-drivers/profiles/h170-free-packages.scm}"
          # `guix pack -m` takes a manifest and packs the whole set into one
          # tarball. The tarball is written into the store and its path printed,
          # so nothing appears in the working directory - copying is the step that
          # makes it an artifact.
          pack_output="$(guix time-machine -C channels.lock.scm -- \
                          pack -f tarball -C zstd -L . -m "$manifest")"
          tarball="$(printf '%s\n' "$pack_output" | tail -n 1)"
          case "$tarball" in
            /gnu/store/*.tar.zst) ;;
            *) echo "refusing non-tarball output: $tarball" >&2; exit 1 ;;
          esac
          name="h170-free-pack-$(git rev-parse --short=12 HEAD).tar.zst"
          cp "$tarball" "artifacts/$name"
          PACK_SHA256="$(sha256sum "artifacts/$name" | cut -d ' ' -f1)"
          PACK_SIZE="$(stat -c '%s' "artifacts/$name")"
          [ "$PACK_SIZE" -lt 2000000000 ] || {
            echo "::error::H170 pack exceeds GitHub's per-asset release limit; no Release will be created."
            exit 1
          }
          ( cd artifacts && sha256sum "$name" > "$name.sha256" )
          {
            echo "Package set: H170 Free manifest"
            echo "Source commit: $GITHUB_SHA"
            echo "Guix version: $(guix --version | head -n1)"
            echo "Channel lock SHA-256: $(sha256sum channels.lock.scm | cut -d ' ' -f1)"
            echo "Manifest: $manifest"
            echo "Manifest SHA-256: $(sha256sum "$manifest" | cut -d ' ' -f1)"
            echo "Pack file: $name"
            echo "Pack SHA-256: $PACK_SHA256"
            echo "Pack size bytes: $PACK_SIZE"
            echo "Scope: upstream GNU Guix Free package manifest only; excludes WSM-owned tools, Nonguix, proprietary NVIDIA driver, firmware and Intel microcode."
            echo "Artifact type: self-contained Guix pack tarball; not a signed substitute cache."
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum "$name" PROVENANCE.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ls -lh "artifacts/$name"
          echo "WSM_PACKED_MANIFEST=$manifest" >> "$GITHUB_STEP_SUMMARY"

      - name: Запакувати кожен пакет у tarball (без ключа)
        if: ${{ (inputs.packages || '') != '' }}
        run: |
          set -euo pipefail
          while IFS="$(printf '\t')" read -r package store_path; do
            # `guix pack` takes PACKAGE specifications, not store paths: it runs
            # every positional argument through specification->package and exits
            # with "unknown package" for a /gnu/store path. `guix package` does
            # accept a store path, which is why the wrong form looks plausible.
            pack_output="$(guix time-machine -C channels.lock.scm -- \
                            pack -f tarball -C zstd -L . "$package")"
            tarball="$(printf '%s\n' "$pack_output" | tail -n 1)"
            case "$tarball" in
              /gnu/store/*.tar.zst) ;;
              *) echo "refusing non-tarball output for $package: $tarball" >&2; exit 1 ;;
            esac
            name="${package}-$(git rev-parse --short HEAD).tar.zst"
            cp "$tarball" "artifacts/$name"
            ( cd artifacts && sha256sum "$name" > "$name.sha256" )
            ls -l "artifacts/$name"
          done < artifacts/store-paths.txt
          cat artifacts/*.sha256

      - name: Зберегти як artifact прогону
        uses: actions/upload-artifact@v7
        with:
          name: wsm-channel-artifacts
          path: |
            artifacts/*.tar.zst
            artifacts/*.tar.zst.sha256
          if-no-files-found: error

      - name: Створити, перевірити й опублікувати окремий H170 Free реліз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="h170-free-pack-${SHORT_SHA}"
          NAME="h170-free-pack-${SHORT_SHA}.tar.zst"
          OUT="$GITHUB_WORKSPACE/artifacts"
          NOTES="$OUT/RELEASE-NOTES.md"
          test -s "$OUT/$NAME"
          test -s "$OUT/PROVENANCE.txt"
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS
            zstd -t "$NAME"
          )
          cat > "$NOTES" <<EOF
          # H170 Free Guix manifest package set

          Self-contained Guix pack of the fixed upstream-only H170 Free manifest.

          - Source commit: $GITHUB_SHA
          - Guix channel lock SHA-256: $(sha256sum channels.lock.scm | cut -d ' ' -f1)
          - Package manifest: drivers/profiles/h170-free-packages.scm
          - Archive SHA-256: $(sha256sum "$OUT/$NAME" | cut -d ' ' -f1)

          This archive is a package bundle, not a substitute cache. It does not
          include WSM-owned tools, Nonguix, proprietary NVIDIA drivers, GP107
          firmware, linux-firmware, or Intel microcode. Kernel/GPU runtime and
          physical H170/GTX 1050 Ti compatibility are not certified by this build.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$TAG" \
            "$OUT/$NAME" "$OUT/$NAME.sha256" "$OUT/PROVENANCE.txt" "$OUT/SHA256SUMS" "$NOTES" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "H170 Free Guix manifest pack ($SHORT_SHA)" \
            --notes-file "$NOTES" \
            --draft --prerelease

          READBACK="$RUNNER_TEMP/h170-free-pack-readback"
          mkdir -p "$READBACK"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$READBACK"
          (
            cd "$READBACK"
            sha256sum -c SHA256SUMS
            zstd -t "$NAME"
            test -s PROVENANCE.txt
          )
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          {
            echo "### Public H170 Free manifest package release"
            echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "Read-back SHA-256 and zstd integrity: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Повідомити про збій
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::error::Публікацію артефактів зупинено. Дивіться крок вище."
          echo "### Збій публікації" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$GITHUB_SHA/comments" \
            -f body="Публікація артефактів не вдалася: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            >/dev/null || true
