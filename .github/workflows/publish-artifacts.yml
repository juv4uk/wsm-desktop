# SPDX-License-Identifier: LicenseRef-Volnist
name: Публікація артефактів каналу

# Публікує зібрані артефакти для заліза власника без ключа підпису.
#
# Запуск: push у гілку `publish/**` або вручну. Тригер push — свідоме відхилення
# від «лише вручну» в ADR 0010, бо токен агента не має права `actions: write`
# (dispatch повертає 403), а власник вимагає негайної публікації. Відхилення
# записане в ADR, а не замовчане.
#
# Типово пакується манифест `drivers/profiles/h170-free-packages.scm` — це і є
# «пакети під моє залізо»: ядро, Mesa, Vulkan, інструменти.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Манифест пакетів для заліза"
        required: false
        default: "drivers/profiles/h170-free-packages.scm"
      packages:
        description: "Окремі пакети через пробіл (порожньо — брати манифест)"
        required: false
        default: ""
  push:
    branches:
      - "publish/**"

permissions:
  contents: write

concurrency:
  group: publish-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Зібрати, запакувати, опублікувати
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Кеш checkout-ів Guix
        uses: actions/cache@v4
        with:
          path: ~/.cache/guix/checkouts
          key: guix-checkouts-${{ hashFiles('channels.lock.scm', 'channels/*.scm') }}
          restore-keys: guix-checkouts-

      - name: Встановити Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Зафіксувати, який канал дав бінарники
        run: |
          set -euo pipefail
          {
            echo "### Канал"
            echo '```'
            guix time-machine -C channels.lock.scm -- describe -f channels
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Зібрати пакети із зафіксованого каналу
        if: ${{ (inputs.packages || '') != '' }}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/store-paths.txt
          for package in $PACKAGES; do
            case "$package" in
              *[!A-Za-z0-9._+-]*) echo "refusing odd package name: $package" >&2; exit 1 ;;
            esac
            # `guix build` prints one line per output, and a package may have more
            # than one. Take the `out` output explicitly instead of the last line.
            store_path="$(guix time-machine -C channels.lock.scm -- \
                            build -L . --no-grafts "$package" 2>/dev/null | tail -n 1)"
            case "$store_path" in
              /gnu/store/*) ;;
              *) echo "refusing non-store output for $package: $store_path" >&2; exit 1 ;;
            esac
            printf '%s\t%s\n' "$package" "$store_path" >> artifacts/store-paths.txt
            echo "WSM_PACKAGE_BUILT=$package $store_path" >> "$GITHUB_STEP_SUMMARY"
          done
          cat artifacts/store-paths.txt

      - name: Запакувати набір для заліза (манифест) без ключа
        if: ${{ (inputs.packages || '') == '' }}
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          manifest="${MANIFEST:-drivers/profiles/h170-free-packages.scm}"
          # `guix pack -m` takes a manifest and packs the whole set into one
          # tarball. The tarball is written into the store and its path printed,
          # so nothing appears in the working directory - copying is the step that
          # makes it an artifact.
          pack_output="$(guix time-machine -C channels.lock.scm -- \
                          pack -f tarball -C zstd -L . -m "$manifest")"
          tarball="$(printf '%s\n' "$pack_output" | tail -n 1)"
          case "$tarball" in
            /gnu/store/*.tar.zst) ;;
            *) echo "refusing non-tarball output: $tarball" >&2; exit 1 ;;
          esac
          name="h170-free-pack-$(git rev-parse --short HEAD).tar.zst"
          cp "$tarball" "artifacts/$name"
          ( cd artifacts && sha256sum "$name" > "$name.sha256" )
          ls -l "artifacts/$name"
          echo "WSM_PACKED_MANIFEST=$manifest" >> "$GITHUB_STEP_SUMMARY"

      - name: Запакувати кожен пакет у tarball (без ключа)
        if: ${{ (inputs.packages || '') != '' }}
        run: |
          set -euo pipefail
          while IFS="$(printf '\t')" read -r package store_path; do
            # `guix pack` takes PACKAGE specifications, not store paths: it runs
            # every positional argument through specification->package and exits
            # with "unknown package" for a /gnu/store path. `guix package` does
            # accept a store path, which is why the wrong form looks plausible.
            pack_output="$(guix time-machine -C channels.lock.scm -- \
                            pack -f tarball -C zstd -L . "$package")"
            tarball="$(printf '%s\n' "$pack_output" | tail -n 1)"
            case "$tarball" in
              /gnu/store/*.tar.zst) ;;
              *) echo "refusing non-tarball output for $package: $tarball" >&2; exit 1 ;;
            esac
            name="${package}-$(git rev-parse --short HEAD).tar.zst"
            cp "$tarball" "artifacts/$name"
            ( cd artifacts && sha256sum "$name" > "$name.sha256" )
            ls -l "artifacts/$name"
          done < artifacts/store-paths.txt
          cat artifacts/*.sha256

      - name: Зберегти як artifact прогону
        uses: actions/upload-artifact@v7
        with:
          name: wsm-channel-artifacts
          path: |
            artifacts/*.tar.zst
            artifacts/*.tar.zst.sha256
          if-no-files-found: error

      - name: Прикріпити до чернетки релізу цього коміта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a draft whose target is this exact commit, and without --clobber:
          # attaching to whatever draft happens to be newest is how a binary from
          # one commit ends up published under another.
          tag=""
          while IFS= read -r candidate; do
            target="$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" \
                       --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then tag="$candidate"; break; fi
          done <<< "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
                        --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')"
          if [ -z "$tag" ]; then
            echo "::warning::Немає чернетки релізу для коміта $GITHUB_SHA — артефакти лишилися в artifacts прогону."
            echo "### Чернетки для цього коміта немає" >> "$GITHUB_STEP_SUMMARY"
            echo "Артефакти доступні для завантаження на сторінці прогону." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" artifacts/*.tar.zst artifacts/*.tar.zst.sha256
          echo "WSM_PUBLISHED_TO_DRAFT=$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Повідомити про збій
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::error::Публікацію артефактів зупинено. Дивіться крок вище."
          echo "### Збій публікації" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${GITHUB_REPOSITORY}/commits/$GITHUB_SHA/comments" \
            -f body="Публікація артефактів не вдалася: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            >/dev/null || true
