# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

on:
  push:
    branches: [main]
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "schemas/hardware-report.schema.json"
      - "schemas/hardware-classification.schema.json"
      - "schemas/profile-evidence.schema.json"
      - "wsm_install/profile.py"
      - "tests/test_fpc*.py"
      - "scripts/check_pascal_sources.py"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "schemas/hardware-report.schema.json"
      - "schemas/hardware-classification.schema.json"
      - "schemas/profile-evidence.schema.json"
      - "wsm_install/profile.py"
      - "tests/test_fpc*.py"
      - "scripts/check_pascal_sources.py"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and verify six native FPC tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python for schema and reference tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned FPC and schema validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl-3.2.2 make binutils
          test "$(fpc -iV)" = "3.2.2"
          python -m pip install --disable-pip-version-check 'jsonschema[format]==4.26.0' pyyaml

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Build all six native FPC programs
        run: |
          set -euo pipefail
          make -C tools/pascal clean all
          for program in wsm-hwcheck wsm-classify wsm-partition wsm-profile wsm-preflight wsm-install; do
            test -x "tools/pascal/build/$program"
          done
          ls -lh tools/pascal/build
          {
            echo "### Free Pascal 3.2.2 build"
            echo ""
            for program in wsm-hwcheck wsm-classify wsm-partition wsm-profile wsm-preflight wsm-install; do
              echo "- $program: compiled"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate hardware schema and Python parity
        run: python3 tests/test_fpc_package.py

      - name: Check read-only partition planner at runtime
        env:
          WSM_PARTITION_FPC_BINARY: tools/pascal/build/wsm-partition
        run: python3 tests/test_fpc_partition.py

      - name: Check profile reader at runtime
        env:
          WSM_PROFILE_FPC_BINARY: tools/pascal/build/wsm-profile
        run: python3 tests/test_fpc_profile.py

      - name: Check preflight and installer CLI contracts
        run: |
          python3 tests/test_fpc_preflight.py
          python3 tests/test_fpc_cli.py

      - name: Keep the compiled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: tools/pascal/build
          retention-days: 7
          if-no-files-found: ignore
