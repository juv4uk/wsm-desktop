# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

# Pin the compiler and build every executable declared by tools/pascal/Makefile.
# Runtime tests compare the native tools with the Python reference and validate
# both JSON contracts. A green run therefore proves real compilation and parity,
# not merely that source files contain expected words.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "schemas/hardware-report.schema.json"
      - "schemas/hardware-classification.schema.json"
      - "tests/test_fpc*.py"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "schemas/hardware-report.schema.json"
      - "schemas/hardware-classification.schema.json"
      - "tests/test_fpc*.py"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, validate and compare native FPC tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python for schema and reference tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned FPC and schema validator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl-3.2.2 make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV
          python -m pip install --disable-pip-version-check 'jsonschema[format]==4.26.0'

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Build all three native FPC programs
        run: |
          set -euo pipefail
          make -C tools/pascal clean all
          test -x tools/pascal/build/wsm-hwcheck
          test -x tools/pascal/build/wsm-classify
          test -x tools/pascal/build/wsm-partition
          test -x tools/pascal/build/wsm-profile
          test -x tools/pascal/build/wsm-partition
          ls -lh tools/pascal/build
          {
            echo "### Free Pascal 3.2.2 build"
            echo ""
            echo "- wsm-hwcheck: compiled"
            echo "- wsm-classify: compiled"
            echo "- wsm-partition: compiled"
            echo "- wsm-profile: compiled"
            echo "- wsm-partition: compiled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate report schema and Python parity at runtime
        run: |
          python3 tests/test_fpc_package.py
          WSM_PARTITION_FPC_BINARY=tools/pascal/build/wsm-partition python3 tests/test_fpc_partition.py

      - name: Check the read-only partition planner contract
        run: python3 tests/test_fpc_partition.py

      - name: Check the FPC profile reader contract and runtime output
        run: python3 tests/test_fpc_profile.py

      - name: Keep the compiled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: tools/pascal/build
          retention-days: 7
          if-no-files-found: ignore

      - name: Report compiler or parity failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### Free Pascal build or parity checks failed"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "Compiler version: $(fpc -iV 2>&1 || true)"
            echo "The preceding step contains the compiler output, JSON Schema errors or Python parity diff."
            echo ""
            echo "Build directory:"
            find tools/pascal/build -maxdepth 1 -type f -printf '%f\n' 2>&1 || true
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null || true
