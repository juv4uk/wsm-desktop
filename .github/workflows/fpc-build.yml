# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

# A green run must compile real Pascal programs and run their behaviour tests.
# An empty program list is a failure, never an empty success.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test every Pascal program
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned FPC compiler and FCL units
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl-3.2.2 make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Compile every Pascal program and library
        run: |
          set -euo pipefail
          mapfile -t pascal_sources < <(
            git ls-files '*.lpr' '*.pas' '*.pp' | grep -v '^third_party/' || true
          )
          programs=()
          for source in "${pascal_sources[@]}"; do
            if grep -Eiq '^[[:space:]]*(program|library)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*([[:space:]]*;|[[:space:]]*)' "$source"; then
              programs+=("$source")
            fi
          done
          if [ "${#programs[@]}" -eq 0 ]; then
            echo "::error::No Pascal program/library entry points were found; refusing a false-green build."
            echo "WSM_FPC_PROGRAMS=0" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p build/fpc
          failed=0
          for program in "${programs[@]}"; do
            echo "::group::fpc $program"
            if ! fpc -B -O2 -Mobjfpc -Sh -Fu"$(dirname "$program")" -FUbuild/fpc -FEbuild/fpc "$program"; then
              echo "::error::Free Pascal refused to compile $program"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          {
            echo "### Free Pascal compilation"
            echo
            echo "Program entry points: ${#programs[@]}, failed: $failed"
            printf '%s\\n' "${programs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || exit 1

      - name: Set up Python for schema and parity tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the report schema validator
        run: python -m pip install --quiet 'jsonschema[format]==4.26.0'

      - name: Validate the native collector against schema and Python reference
        run: python3 tests/test_fpc_collector_parity.py

      - name: Exercise the native classifier
        run: python3 tests/test_fpc_classify_runtime.py

      - name: Keep compiled binaries as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: build/fpc
          retention-days: 7
          if-no-files-found: ignore

      - name: Summarize failure without write permissions
        if: failure()
        run: |
          {
            echo "### Free Pascal build failed"
            echo
            echo "The first failing compiler or runtime-test step above contains the exact diagnostic."
            echo "No binary is committed to a Git branch; successful outputs are workflow artifacts."
            echo
            echo '```'
            ls -la build/fpc 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
