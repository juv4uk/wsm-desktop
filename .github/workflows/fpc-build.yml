# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

# The owner approved Free Pascal as the implementation language for WSM tools
# (ADR-006 in juv4uk/wsm-os-lisp). Nothing in the development environment can compile
# Pascal — there is no fpc there and freepascal.org is unreachable — so a Pascal file
# that has never been compiled is exactly the kind of artefact this project keeps
# getting burned by: green tests over source text that a compiler would reject.
#
# This workflow is the compiler. It pins the same toolchain version the RE repository
# uses, builds every Pascal program in the tree, and fails on the first error.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile every Pascal program
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Free Pascal toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl-3.2.2 make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Build every program
        run: |
          set -euo pipefail
          mapfile -t pascal_sources < <(
            git ls-files '*.lpr' '*.pas' '*.pp' | grep -v '^third_party/' || true
          )
          programs=()
          for source in "${pascal_sources[@]}"; do
            # Compile program/library entry points from every supported extension.
            # A Pascal unit is compiled as an entry point's dependency.
            if grep -Eiq '^[[:space:]]*(program|library)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*;' "$source"; then
              programs+=("$source")
            fi
          done
          if [ "${#programs[@]}" -eq 0 ]; then
            echo "::error::No Pascal program/library entry points were found; refusing a vacuous successful build."
            echo "WSM_FPC_PROGRAMS=0" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p build/fpc
          failed=0
          for program in "${programs[@]}"; do
            echo "::group::fpc $program"
            if ! fpc -B -O2 -Mobjfpc -Sh -Fu"$(dirname "$program")" -FUbuild/fpc -FEbuild/fpc "$program"; then
              echo "::error::Free Pascal refused to compile $program"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          ls -l build/fpc || true
          {
            echo "### Free Pascal build"
            echo ""
            echo "Program entry points: ${#programs[@]}, failed: $failed"
            printf '%s\\n' "${programs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || exit 1

      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install report schema validator
        run: python -m pip install --quiet 'jsonschema[format]==4.26.0'

      - name: Verify the WSM FPC collector against the Python reference
        run: python3 tests/test_fpc_collector_parity.py

      - name: Keep the compiled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: build/fpc
          retention-days: 7
          if-no-files-found: ignore

      - name: Підсумувати причину збою
        if: failure()
        run: |
          {
            echo "### Free Pascal build: компіляція не пройшла"
            echo
            echo "Компілятор відмовився зібрати один або кілька Pascal entry points."
            echo "Точна помилка наведена в кроці збірки вище; первинні логи залишаються в цьому Actions run."
            echo
            echo "#### Каталог збірки"
            echo '```'
            ls -la build/fpc 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
