# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

# The owner approved Free Pascal as the implementation language for WSM tools
# (ADR-006 in juv4uk/wsm-os-lisp). Nothing in the development environment can compile
# Pascal — there is no fpc there and freepascal.org is unreachable — so a Pascal file
# that has never been compiled is exactly the kind of artefact this project keeps
# getting burned by: green tests over source text that a compiler would reject.
#
# This workflow is the compiler. It pins the same toolchain version the RE repository
# uses, builds every Pascal program in the tree, and fails on the first error.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile every Pascal program
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Free Pascal toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # fpjson (модуль fpjson, який використовують wsm_classify і
          # wsm_profile) живе в пакунку fp-units-fcl, а не в fp-compiler.
          # Без нього компілятор каже «Can't find unit fpjson» — і саме це
          # показав перший прогін, коли крок почав справді компілювати.
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Build every program
        run: |
          set -euo pipefail
          # Програма — це файл із ключовим словом `program', а не файл із
          # певним розширенням. Попередня версія шукала лише *.lpr, тоді як у
          # дереві п'ять *.pas — і крок друкував «No Pascal programs in the
          # tree yet», тобто зелений результат доводив рівно нічого.
          mapfile -t sources < <(git ls-files '*.pas' '*.pp' '*.lpr' | grep -v '^third_party/' || true)
          programs=()
          for source in "${sources[@]}"; do
            if grep -qiE '^[[:space:]]*program[[:space:]]+[A-Za-z_]' "$source"; then
              programs+=("$source")
            fi
          done
          # Знайдено джерела, але жодної програми — це зламаний фільтр, а не
          # порожнє дерево. Мовчазний зелений тут гірший за червоний.
          if [ "${#sources[@]}" -gt 0 ] && [ "${#programs[@]}" -eq 0 ]; then
            echo "::error::Pascal sources exist (${#sources[@]}) but none was recognised as a program"
            exit 1
          fi
          if [ "${#programs[@]}" -eq 0 ]; then
            echo "No Pascal sources in the tree yet; nothing to compile."
            echo "WSM_FPC_PROGRAMS=0" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p build/fpc
          failed=0
          for program in "${programs[@]}"; do
            echo "::group::fpc $program"
            # -Fu on the program's own directory: fpc searches the *current* directory
            # for units, not the directory of the file it was given, so a program that
            # `uses` a unit beside it only compiles when this path is explicit.
            # wsm_install_cli.lpr uses wsmjson.pas this way.
            if ! fpc -O2 -Mobjfpc -Sh -Fu"$(dirname "$program")" \
                     -FUbuild/fpc -FEbuild/fpc "$program"; then
              echo "::error::Free Pascal refused to compile $program"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          ls -l build/fpc || true
          {
            echo "### Free Pascal build"
            echo ""
            echo "Programs: ${#programs[@]}, failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || exit 1

      # Паритет: дві реалізації одного звіту варті чогось лише тоді, коли
      # щось їх порівнює. Тест збирає програму ще раз (дешево), запускає її
      # і Python-колектор на тому самому sysfs і порівнює поля.
      - name: Compare the native collector with the Python one
        run: python3 tests/test_pascal_parity.py -v

      - name: Keep the compiled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: build/fpc
          retention-days: 7
          if-no-files-found: ignore

      - name: Повідомити причину збою
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### Free Pascal build: компіляція не пройшла"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Компілятор відмовився збирати один або кілька Pascal-файлів."
            echo "Це саме те, що локальне середовище перевірити не може: там немає fpc."
            echo ""
            echo "#### зібрані бінарники"
            echo '```'
            ls -la build/fpc 2>&1 || true
            echo '```'
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null && echo "причину записано коментарем"
