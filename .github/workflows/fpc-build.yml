# SPDX-License-Identifier: LicenseRef-Volnist
name: Free Pascal build

# The owner approved Free Pascal as the implementation language for WSM tools
# (ADR-006 in juv4uk/wsm-os-lisp). Nothing in the development environment can compile
# Pascal — there is no fpc there and freepascal.org is unreachable — so a Pascal file
# that has never been compiled is exactly the kind of artefact this project keeps
# getting burned by: green tests over source text that a compiler would reject.
#
# This workflow is the compiler. It pins the same toolchain version the RE repository
# uses, builds every Pascal program in the tree, and fails on the first error.

on:
  push:
    branches:
      - main
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "tests/test_fpc*.py"
      - ".github/workflows/fpc-build.yml"
  pull_request:
    paths:
      - "**/*.pas"
      - "**/*.lpr"
      - "**/*.pp"
      - "tools/pascal/Makefile"
      - "wsm/packages/fpc-tools.scm"
      - "wsm/licenses.scm"
      - "tests/test_fpc*.py"
      - ".github/workflows/fpc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpc-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile every Pascal program
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Free Pascal toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fp-compiler-3.2.2 fp-units-fcl-3.2.2 python3-jsonschema make binutils
          test "$(fpc -iV)" = "3.2.2"
          fpc -iV

      - name: Check the Pascal source contract
        run: python3 scripts/check_pascal_sources.py

      - name: Build every program
        run: |
          set -euo pipefail
          mapfile -t pascal_sources < <(
            git ls-files '*.pas' '*.pp' '*.lpr' | grep -v '^third_party/' | sort || true
          )
          if [ "${#pascal_sources[@]}" -eq 0 ]; then
            echo "::error::No Pascal sources in the tree; refusing a false-green build."
            echo "WSM_FPC_SOURCES=0" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          programs=()
          for source in "${pascal_sources[@]}"; do
            if grep -Eiq '^[[:space:]]*(program|library)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' "$source"; then
              programs+=("$source")
            fi
          done
          if [ "${#programs[@]}" -eq 0 ]; then
            echo "::error::Pascal sources exist but no program/library entry point was found."
            echo "WSM_FPC_PROGRAMS=0" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "${pascal_sources[@]}"
            exit 1
          fi

          mkdir -p build/fpc
          failed=0
          for program in "${programs[@]}"; do
            name="$(basename "${program%.*}")"
            echo "::group::fpc $program"
            if ! fpc -B -O2 -Mobjfpc -Sh -Fu"$(dirname "$program")" \
                -FUbuild/fpc -FEbuild/fpc -o"build/fpc/$name" "$program"; then
              echo "::error::Free Pascal refused to compile $program"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -eq 0 ]; then
            test -x build/fpc/wsm_hwcheck
            test -x build/fpc/wsm_classify
            test -x build/fpc/wsm_cpu_isa
            test -x build/fpc/wsm_partition
            test -x build/fpc/wsm_profile
            test -x build/fpc/wsm_preflight
            test -x build/fpc/wsm_install
            echo "::group::Hardware collector schema and PCI parity"
            python3 tests/test_fpc_collector_parity.py || failed=$((failed + 1))
            echo "::endgroup::"
            echo "::group::Classifier behavior tests"
            python3 tests/test_fpc_classify_runtime.py || failed=$((failed + 1))
            echo "::endgroup::"
            echo "::group::CPU ISA contract tests"
            python3 tests/test_fpc_cpu_isa_runtime.py
            python3 tests/test_fpc_partition.py
            python3 tests/test_fpc_partition_runtime.py || failed=$((failed + 1))
            python3 tests/test_fpc_profile.py
            python3 tests/test_fpc_profile_runtime.py || failed=$((failed + 1))
            python3 tests/test_fpc_preflight.py
            python3 tests/test_fpc_preflight_runtime.py || failed=$((failed + 1))
            python3 tests/test_fpc_cli.py
            python3 tests/test_fpc_install_runtime.py || failed=$((failed + 1))
            echo "::endgroup::"
          fi
          ls -l build/fpc || true
          {
            echo "### Free Pascal build and runtime tests"
            echo ""
            echo "Sources: ${#pascal_sources[@]}, program entry points: ${#programs[@]}, failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ] || exit 1

      - name: Keep the compiled binaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpc-binaries
          path: build/fpc
          retention-days: 7
          if-no-files-found: ignore

      - name: Повідомити причину збою
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          BODY=$(mktemp)
          {
            echo "### Free Pascal build: компіляція не пройшла"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Компілятор відмовився збирати один або кілька Pascal-файлів."
            echo "Це саме те, що локальне середовище перевірити не може: там немає fpc."
            echo ""
            echo "#### зібрані бінарники"
            echo '```'
            ls -la build/fpc 2>&1 || true
            echo '```'
          } > "$BODY"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -F body=@"$BODY" >/dev/null && echo "причину записано коментарем"
