name: WSM hwcheck in isolated QEMU guest

on:
  push:
    branches:
      - work/hwcheck-qemu-guest
      - fix/hwcheck-qemu-report-chunked-v3
  pull_request:
    paths:
      - ".github/workflows/hwcheck-qemu-guest.yml"
      - "scripts/ci_qemu_hwcheck_guest.py"
      - "scripts/qemu_boot_smoke.py"
      - "wsm_hwcheck/**"
      - "schemas/hardware-report.schema.json"
      - "docs/testing/HWCHECK-QEMU-GUEST.md"
      - "tests/test_qemu_hwcheck_guest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hwcheck-guest:
    name: Run actual wsm_hwcheck in a no-disk Linux guest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up host validation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host-side QEMU and initramfs tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-system-x86 busybox-static cpio gzip

      - name: Install schema validator on the host only
        run: python -m pip install -r requirements-dev.txt

      - name: Run host-side guest assembly, archive, and report transport tests
        run: python -m unittest discover -s tests -p "test_qemu_hwcheck_guest.py" -v

      - name: Boot guest and validate its actual WSM hardware report
        run: python scripts/ci_qemu_hwcheck_guest.py
