# SPDX-License-Identifier: LicenseRef-Volnist
name: WSM hardware package build evidence

# Ephemeral build evidence only. No NAR file, Actions artifact, Release or Pages output.
# The runner's store disappears after the job. Distribution remains disabled until #367,
# channel trust, firmware rights (#586), endpoint and key custody are approved.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Guix package variables, separated by spaces"
        required: false
        type: string
        default: "wsm-tools"

permissions:
  contents: read

concurrency:
  group: wsm-hw-build-evidence
  cancel-in-progress: true

jobs:
  build:
    name: Build package set and report metadata (no retained NAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Guix
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl enable --now guix-daemon.service
          guix --version

      - name: Build each package on the release lock
        env:
          PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PACKAGES" == *$'\n'* || "$PACKAGES" == *$'\r'* ]]; then
            echo "package list must be a single line" >&2
            exit 1
          fi
          read -r -a packages <<< "$PACKAGES"
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "package list is empty" >&2
            exit 1
          fi
          {
            echo "| package | store path | NAR stream bytes |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          failures=0
          for package in "${packages[@]}"; do
            case "$package" in
              ""|-*|*[!A-Za-z0-9._+-]*)
                echo "refusing invalid package name: $package" >&2
                exit 1
                ;;
            esac
            if ! store_path="$(guix time-machine -C channels.lock.scm -- build -L . --no-grafts "$package")"; then
              echo "| $package | BUILD FAILED | — |" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              continue
            fi
            # Count the serialized NAR through a process-local pipe. wc discards
            # the stream; no NAR file or downloadable artifact is retained.
            size="$(guix time-machine -C channels.lock.scm -- archive --export "$store_path" 2>/dev/null | wc -c | tr -d '[:space:]')"
            echo "| $package | `$store_path` | $size |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NAR stream counted and discarded; no archive file or artifact was retained or published." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failures" -ne 0 ]]; then
            echo "$failures package(s) failed to build" >&2
            exit 1
          fi

      - name: Пояснити причину збою в summary
        if: failure()
        run: |
          {
            echo "### WSM hardware build evidence: збірка не завершилась"
            echo ""
            echo "Commit: `$GITHUB_SHA`"
            echo ""
            echo "Один або кілька пакетів набору не збираються на locked-каналах."
            echo "Жодного NAR-файлу або завантажуваного артефакту не створено."
            df -h / || true
          } >> "$GITHUB_STEP_SUMMARY"
