version = 1
SPDX-PackageName = "WSM Desktop"

[[annotations]]
path = ["README.md", "README.en.md", "AGENTS.md", "CONTRIBUTING.md", "CONTRIBUTING.en.md", "SECURITY.md", "SECURITY.en.md", "docs/**", "agents/**", "systems/README.md", "installer/**/README.md", "wsm/README.md"]
precedence = "aggregate"
SPDX-License-Identifier = "LicenseRef-Volnist"
SPDX-FileCopyrightText = "2026 WSM Desktop authors"

[[annotations]]
path = ["*.scm", "**/*.scm", "*.py", "**/*.py", "*.pas", "**/*.pas", "Makefile", ".github/workflows/**"]
precedence = "aggregate"
SPDX-License-Identifier = "LicenseRef-Volnist"
SPDX-FileCopyrightText = "2026 WSM Desktop authors"

[[annotations]]
path = ["schemas/**", "drivers/**", "requirements-dev.txt"]
precedence = "aggregate"
SPDX-License-Identifier = "LicenseRef-Volnist"
SPDX-FileCopyrightText = "2026 WSM Desktop authors"

[[annotations]]
path = ["tests/fixtures/**"]
precedence = "aggregate"
SPDX-License-Identifier = "LicenseRef-Volnist"
SPDX-FileCopyrightText = "2026 WSM Desktop authors"
