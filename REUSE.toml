version = 1
SPDX-PackageName = "WSM Desktop"

[[annotations]]
path = ["README.md", "README.en.md", "CONTRIBUTING.md", "CONTRIBUTING.en.md", "SECURITY.md", "SECURITY.en.md", "docs/**", "systems/README.md", "installer/**/README.md", "wsm/README.md"]
precedence = "aggregate"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["*.scm", "**/*.scm", "*.py", "**/*.py", "Makefile", ".github/workflows/**"]
precedence = "aggregate"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["schemas/**", "requirements-dev.txt"]
precedence = "aggregate"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["tests/fixtures/**"]
precedence = "aggregate"
SPDX-License-Identifier = "CC-BY-SA-4.0"
